<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1080, initial-scale=1">
<title>心情拉霸機</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#020510;}
#bg{
  position:fixed;inset:0;width:1080px;height:1440px;top:0;left:0;
  background:url('1.png') no-repeat top center / 1080px auto;
  z-index:20;pointer-events:none;
}
#bg-ext{position:fixed;top:1440px;left:0;width:1080px;height:480px;background:#020510;z-index:0;}
#reel-overlay{
  position:absolute;top:254px;left:292px;
  width:554px;height:699px;
  z-index:5;overflow:hidden;border-radius:6px;
}
#reels{display:flex;width:100%;height:100%;overflow:hidden;}
.reel{
  flex-shrink:0;overflow:hidden;position:relative;background:#07091a;
}
.reel:not(:last-child){border-right:3px solid rgba(100,70,10,0.5);}
.reel::before,.reel::after{
  content:'';position:absolute;left:0;right:0;height:100px;z-index:10;pointer-events:none;
}
.reel::before{top:0;background:linear-gradient(to bottom,#07091a 0%,rgba(7,9,26,0.5) 60%,transparent 100%);}
.reel::after{bottom:0;background:linear-gradient(to top,#07091a 0%,rgba(7,9,26,0.5) 60%,transparent 100%);}
.track{position:absolute;top:0;left:0;width:100%;display:flex;flex-direction:column;will-change:transform;}
.card{
  width:100%;height:233px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#07091a;border-bottom:1px solid rgba(100,70,10,0.3);overflow:hidden;
}
.card-frame{flex-shrink:0;background-repeat:no-repeat;}
#win-bar{
  position:absolute;left:0;right:0;
  top:calc(41% + 77px);transform:translateY(-50%);
  height:9px;
  background:linear-gradient(90deg,transparent,#00eeff,#ffffff,#00eeff,transparent);
  box-shadow:0 0 32px #00eeff,0 0 64px #0088ff;
  z-index:20;pointer-events:none;
  animation:winpulse 1s ease-in-out infinite alternate;
}
@keyframes winpulse{
  0%{opacity:0.7;box-shadow:0 0 24px #00eeff,0 0 48px #0088ff}
  100%{opacity:1;box-shadow:0 0 48px #fff,0 0 96px #00eeff,0 0 160px #0088ff}
}
</style>
</head>
<body>
<div id="bg"></div>
<div id="bg-ext"></div>
<div id="reel-overlay">
  <div id="win-bar"></div>
  <div id="reels">
    <div class="reel" id="reel0"><div class="track" id="t0"></div></div>
    <div class="reel" id="reel1"><div class="track" id="t1"></div></div>
    <div class="reel" id="reel2"><div class="track" id="t2"></div></div>
  </div>
</div>
<script>
const SHEETS={
  2:{file:'2.png',iw:1254,ih:1254,x:[[4,315],[316,628],[627,939],[938,1252]],y:[[3,317],[316,628],[626,924],[922,1243]]},
  3:{file:'3.png',iw:1254,ih:1254,x:[[2,317],[312,628],[623,940],[935,1251]],y:[[2,334],[331,642],[639,947],[942,1253]]},
  4:{file:'4.png',iw:1254,ih:1254,x:[[4,317],[316,627],[624,937],[935,1249]],y:[[5,334],[331,640],[636,938],[934,1250]]},
  5:{file:'5.png',iw:1254,ih:1254,x:[[5,317],[316,628],[625,939],[936,1249]],y:[[4,329],[326,641],[639,952],[950,1248]]},
  6:{file:'6.png',iw:1254,ih:1254,x:[[4,317],[314,628],[624,939],[935,1249]],y:[[5,330],[327,639],[637,944],[941,1247]]},
  7:{file:'7.png',iw:1254,ih:1254,x:[[4,317],[314,628],[625,939],[937,1251]],y:[[4,330],[327,640],[638,945],[941,1247]]},
  8:{file:'8.png',iw:1254,ih:1254,x:[[3,316],[313,627],[624,939],[936,1251]],y:[[3,333],[330,645],[642,930],[925,1223]]},
  9:{file:'9.png',iw:1254,ih:1254,x:[[0,316],[311,629],[625,941],[937,1254]],y:[[2,318],[314,629],[625,932],[929,1238]]},
};

const frameW=210, frameH=239;
const imgScaleX=0.80, imgScaleY=1.00;
const imgXOffset=20, imgYOffset=0;
const colWidths=[164,170,164];

function getSpriteInfo(id){
  const si=Math.floor((id-1)/16)+2;
  const ci=(id-1)%16;
  const col=ci%4,row=Math.floor(ci/4);
  const s=SHEETS[si];
  return{file:s.file,iw:s.iw,ih:s.ih,
    sx:s.x[col][0],sy:s.y[row][0],
    sw:s.x[col][1]-s.x[col][0],sh:s.y[row][1]-s.y[row][0]};
}

function applyFrameStyle(el,id){
  const{file,iw,ih,sx,sy,sw,sh}=getSpriteInfo(id);
  const dispW=frameW*imgScaleX,dispH=frameH*imgScaleY;
  const bgW=Math.round(iw/sw*dispW);
  const bgH=Math.round(ih/sh*dispH);
  const bgX=Math.round(-(sx/sw)*dispW)+imgXOffset;
  const bgY=Math.round(-(sy/sh)*dispH)+imgYOffset;
  el.style.backgroundImage=`url('${file}')`;
  el.style.backgroundSize=`${bgW}px ${bgH}px`;
  el.style.backgroundPosition=`${bgX}px ${bgY}px`;
}

const CARD_H=233;
const LAPS=[4,3,2];
const speeds=[1.0,0.93,1.07];

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}
  return b;
}

const ids=Array.from({length:128},(_,i)=>i+1);

// 每條 reel 建立 seq，然後在 DOM 放 [seq, seq] 雙份
// 捲動超過第一份時無縫跳回開頭，完全沒有接縫問題
const seqs=LAPS.map(laps=>{
  let s=[];
  for(let l=0;l<laps;l++) s=s.concat(shuffle(ids));
  return s;
});

const tracks=[document.getElementById('t0'),document.getElementById('t1'),document.getElementById('t2')];
const reelEls=[document.getElementById('reel0'),document.getElementById('reel1'),document.getElementById('reel2')];

reelEls.forEach((r,i)=>r.style.width=colWidths[i]+'px');

// 每條 reel 塞兩份 seq（雙 buffer），這樣只要在第一份結束前跳回就永遠無縫
seqs.forEach((seq,ri)=>{
  const tr=tracks[ri];
  // 塞兩份
  [...seq,...seq].forEach(id=>{
    const d=document.createElement('div');
    d.className='card';
    const frame=document.createElement('div');
    frame.className='card-frame';
    frame.style.width=frameW+'px';
    frame.style.height=frameH+'px';
    applyFrameStyle(frame,id);
    d.appendChild(frame);
    tr.appendChild(d);
  });
});

// loopPx = 一份 seq 的總高度
const loopPx=seqs.map(s=>s.length*CARD_H);

// 每條 reel 各自維護一個累積位移（px），不用 elapsed%loop，避免跳接
const pos=[0,0,0];
let lastTs=null;

function tick(ts){
  if(lastTs===null){lastTs=ts;}
  const dt=ts-lastTs;
  lastTs=ts;

  seqs.forEach((_,ri)=>{
    pos[ri]+=dt*speeds[ri]*1.92*0.001*1000; // dt 單位 ms，每秒跑 speeds*1.92*1000 px？
    // 修正：原本 elapsed*1.92 是每毫秒跑 1.92px → 每秒 1920px
    // dt ms → pos += dt * speeds * 1.92
    pos[ri]+=0; // 上面已算，這行是多的，下面重算

    // 當超過一份 seq 就跳回（無縫，因為第二份內容完全一樣）
    if(pos[ri]>=loopPx[ri]) pos[ri]-=loopPx[ri];
    tracks[ri].style.transform=`translateY(-${pos[ri]}px)`;
  });
  requestAnimationFrame(tick);
}

// 重新正確實作
pos[0]=pos[1]=pos[2]=0;
lastTs=null;

function tick2(ts){
  if(lastTs===null){lastTs=ts;}
  const dt=ts-lastTs; // ms
  lastTs=ts;

  for(let ri=0;ri<3;ri++){
    pos[ri]+=dt*speeds[ri]*1.92; // px，跟原本 elapsed*speeds*1.92 速度一致
    if(pos[ri]>=loopPx[ri]) pos[ri]-=loopPx[ri];
    tracks[ri].style.transform=`translateY(-${pos[ri]}px)`;
  }
  requestAnimationFrame(tick2);
}
requestAnimationFrame(tick2);
</script>
</body>
</html>
