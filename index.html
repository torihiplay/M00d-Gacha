<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;
  min-height:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
  background:#020510;
  position:relative;
}
#app{
  position:absolute;
  top:0;
  left:0;
  width:1080px;
  height:1920px;
  transform-origin: top left;
  background:#020510;
  overflow:hidden;
}
#bg{
  position:absolute;inset:0;
  width:1080px;height:1440px;
  top:0;left:0;
  background:url('1.png') no-repeat top center / 1080px auto;
  z-index:20;pointer-events:none;
}
#bg-ext{position:absolute;top:1440px;left:0;width:1080px;height:480px;background:#020510;z-index:0;}

#reel-overlay{
  position:absolute;top:254px;left:292px;
  width:554px;height:699px;
  z-index:5;overflow:hidden;border-radius:6px;
}
#reels{display:flex;width:100%;height:100%;overflow:hidden;}
.reel{flex-shrink:0;overflow:hidden;position:relative;background:#07091a;}
.reel:not(:last-child){border-right:3px solid rgba(100,70,10,0.5);}
.reel::before,.reel::after{
  content:'';position:absolute;left:0;right:0;height:100px;z-index:10;pointer-events:none;
}
.reel::before{top:0;background:linear-gradient(to bottom,#07091a 0%,rgba(7,9,26,0.5) 60%,transparent 100%);}
.reel::after{bottom:0;background:linear-gradient(to top,#07091a 0%,rgba(7,9,26,0.5) 60%,transparent 100%);}
.track{position:absolute;top:0;left:0;width:100%;display:flex;flex-direction:column;will-change:transform;}
.card{
  width:100%;height:233px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:#07091a;border-bottom:1px solid rgba(100,70,10,0.3);overflow:hidden;
}
.card-img{
  width:180px;height:180px;
  object-fit:contain;
  display:block;
}

#win-bar{
  position:absolute;left:0;right:0;
  top:calc(41% + 77px);transform:translateY(-50%);

  background:linear-gradient(90deg,transparent,#00eeff,#ffffff,#00eeff,transparent);
  box-shadow:0 0 32px #00eeff,0 0 64px #0088ff;
  z-index:20;pointer-events:none;
  animation:winpulse 1s ease-in-out infinite alternate;
}
@keyframes winpulse{
  0%{opacity:0.7;box-shadow:0 0 24px #00eeff,0 0 48px #0088ff}
  100%{opacity:1;box-shadow:0 0 48px #fff,0 0 96px #00eeff,0 0 160px #0088ff}
}

#gacha-btn{
  position:absolute;
  left:50%;transform:translateX(-50%);
  top:1233px;
  width:330px;height:145px;
  border-radius:50px;
  background:transparent;
  border:none;
  cursor:pointer;
  z-index:30;
}
#gacha-btn:active{transform:translateX(-50%) scale(0.96);}

/* ── 結果面板 ── */
#result-panel{
  position:absolute;
  bottom:0;left:4%;right:4%;
  max-height:92%;
  padding-bottom:6%;
  background:linear-gradient(170deg,#0a0820 0%,#0d1535 40%,#0a0820 100%);
  border-top:2px solid rgba(255,215,0,0.5);
  border-radius:36px 36px 0 0;
  z-index:100;
  transform:translateY(100%);
  transition:transform 0.45s cubic-bezier(0.22,1,0.36,1);
  display:flex;flex-direction:column;
  overflow:hidden;
}
#result-panel.show{transform:translateY(0);}

.panel-handle{
  width:60px;height:5px;
  background:rgba(255,215,0,0.4);
  border-radius:3px;
  margin:14px auto 0;flex-shrink:0;
}


.panel-title{
  text-align:center;font-size:38px;font-weight:900;
  color:#ffd700;letter-spacing:3px;
  margin:16px 0 4px;flex-shrink:0;
  text-shadow:0 0 20px rgba(255,215,0,0.5);
}
.panel-subtitle{
  text-align:center;font-size:24px;color:rgba(255,215,0,0.6);
  margin-bottom:12px;flex-shrink:0;
}

/* 三張卡片 */
.cards-row{
  display:flex;gap:16px;
  padding:0 24px;flex-shrink:0;
  justify-content:center;
}
.result-card{
  flex:1;max-width:280px;
  background:rgba(255,255,255,0.04);
  border:1.5px solid rgba(255,215,0,0.25);
  border-radius:20px;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;
}
.result-card-img{
  width:100%;aspect-ratio:1;
  object-fit:contain;
  background:#07091a;
  display:block;
}
.result-card-label{
  font-size:21px;color:#ffd700;font-weight:700;
  padding:8px 6px 10px;text-align:center;
  letter-spacing:1px;
}

/* 解析內容 */
.content-area{
  flex:1;overflow-y:auto;
  padding:24px 28px 16px;
  -webkit-overflow-scrolling:touch;
    min-height:0;

}
.content-area::-webkit-scrollbar{width:4px;}
.content-area::-webkit-scrollbar-thumb{background:rgba(255,215,0,0.3);border-radius:2px;}

.reading-block{margin-bottom:32px;}
.reading-who{
  font-size:26px;font-weight:700;color:#ffd700;
  margin-bottom:10px;
  display:flex;align-items:center;gap:10px;
}
.reading-who::before{
  content:'';display:inline-block;
  width:5px;height:28px;

}
.reading-text{
  font-size:26px;line-height:1.85;

}
.reading-text.placeholder{
  color:rgba(255,255,255,0.3);
  font-style:italic;letter-spacing:2px;
}

.panel-btns{
  display:flex;gap:12px;
  padding:16px 24px 10%;flex-shrink:0;
}
.btn-share{
  flex:1;padding:22px 0;
  background:linear-gradient(135deg,#06c755,#00a846);
  color:#fff;font-size:26px;font-weight:900;
  border:none;border-radius:16px;cursor:pointer;
  letter-spacing:2px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.btn-save{
  flex:1;padding:22px 0;
  background:linear-gradient(135deg,#1a1a2e,#16213e,#0f3460);

  border:1.5px solid rgba(180,140,255,0.4);
  border-radius:16px;cursor:pointer;

}
.btn-again{
  flex:1;padding:22px 0;

  border:none;border-radius:16px;cursor:pointer;
  letter-spacing:2px;
}
.btn-share:active,.btn-save:active,.btn-again:active{transform:scale(0.97);}

#overlay{
  position:absolute;inset:0;
  background:rgba(0,0,0,0);
  z-index:99;pointer-events:none;
  transition:background 0.3s;
}
#overlay.show{background:rgba(0,0,0,0.55);pointer-events:auto;}

/* ── 卡片預覽遮罩 ── */
#card-preview-overlay{

  align-items:center;

}
#card-preview-overlay.show{display:flex;}
#card-preview-img{

}
.preview-hint{

}
.btn-preview-close{
  padding:18px 56px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.18);
  border-radius:14px;

}
.btn-preview-close:active{transform:scale(0.97);}

/* ── 迎賓畫面 ── */
#welcome{
  position:fixed;inset:0;
  z-index:999;
  background:#020510;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;

}
#welcome.fade-out{opacity:0;pointer-events:none;}

#stars-canvas{position:absolute;inset:0;width:100%;height:100%;}

.shooting-star{

  background:linear-gradient(to bottom,rgba(255,255,255,0),#fff);
  border-radius:2px;

}
@keyframes shoot{
  0%{opacity:0;transform:translateY(-40px) rotate(30deg);}

  70%{opacity:0.6;}
  100%{opacity:0;transform:translateY(320px) rotate(30deg);}
}

#enter-btn{
  position:relative;z-index:2;
  width:min(480px,80vw);
  padding:36px 0;
  background:linear-gradient(135deg,rgba(120,80,220,0.25),rgba(80,50,160,0.25));

  cursor:pointer;
  backdrop-filter:blur(10px);
  box-shadow:0 0 40px rgba(140,100,255,0.15),inset 0 0 30px rgba(120,80,220,0.08);

}
#enter-btn:active{transform:scale(0.97);}
#enter-btn .btn-icon{display:block;font-size:48px;margin-bottom:14px;}

</style>

<body>
<!-- ── 迎賓畫面 ── -->
<div id="welcome">

<div id="card-preview-overlay">

<script>
// ══ 星空畫布 ══
(function(){
  const canvas=document.getElementById('stars-canvas');
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);
  const stars=Array.from({length:160},()=>({
    x:Math.random(),y:Math.random(),
    r:Math.random()*1.4+0.3,
    a:Math.random(),da:(Math.random()-0.5)*0.006
  }));
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      s.a=Math.max(0.05,Math.min(1,s.a+s.da));
      if(s.a<=0.05||s.a>=1)s.da*=-1;
      ctx.beginPath();
      ctx.arc(s.x*canvas.width,s.y*canvas.height,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,190,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ══ 迎賓畫面 ══
function enterMain(){
  playMusic(pickRandomTrack());
  const w=document.getElementById('welcome');
  w.classList.add('fade-out');
  setTimeout(()=>w.style.display='none',800);
}

// ══ 手機滿版縮放 ══
function scaleApp(){
  const app=document.getElementById('app');
  const scale=window.innerWidth/1080;
  app.style.transform=`scale(${scale})`;
  app.style.transformOrigin='top left';
  app.style.width='1080px';
  app.style.height='1920px';
  document.body.style.height=`${1920*scale}px`;
  document.body.style.overflowX='hidden';
}
scaleApp();
window.addEventListener('resize',scaleApp);
window.addEventListener('orientationchange',()=>{setTimeout(scaleApp,200);});

// ══ 音樂系統 ══
const MUSIC_FILES=['1.wav','2.wav','3.wav'];
let currentAudio=null;
let currentTrackIndex=-1;

function pickRandomTrack(){return Math.floor(Math.random()*3);}

function playMusic(trackIndex){
  if(currentAudio){currentAudio.pause();currentAudio.src='';currentAudio=null;}
  currentTrackIndex=trackIndex;
  const audio=new Audio(MUSIC_FILES[trackIndex]);
  audio.loop=true;audio.volume=0.7;
  audio.play().catch(()=>{
    document.addEventListener('touchstart',()=>audio.play(),{once:true});
    document.addEventListener('click',()=>audio.play(),{once:true});
  });
  currentAudio=audio;
}

function switchMusic(){playMusic(pickRandomTrack());}

// ══ 解析資料 ══
// ══ 解析資料 ══
const DATA={
  1:{name:'幸運星',emoji:'🌟',
    近況:'你最近正在進入一段「微小幸運開始聚集」的時期。有些事情表面看起來只是巧合，但其實命運已經悄悄偏向你。你可能會發現，原本卡住的人突然回訊息、原本不順的事情突然出現破口，甚至只是走進某個地方，都有種被宇宙偷偷推了一下的感覺。這不是暴富型的幸運，而是「路開始打開」的幸運。很多人抽到幸運星時，人生都正站在下一階段的入口，只是還沒真正意識到。',
    挑戰:'幸運星真正的問題，是容易讓人誤以為「只要等運氣來就好」。你最近最大的挑戰，其實是猶豫。你可能正在等待某個完美時機、完美答案、完美情緒，但宇宙現在給你的不是結果，而是門縫。如果你一直停在原地分析，幸運就會像流星一樣擦身而過。這段時間尤其容易因為害怕失敗，而假裝自己還沒準備好。有些事情其實不用百分之百確定，你真正缺少的，是往前一步的勇氣。',
    貴人:'你的貴人通常不是最強勢的人，而是「會讓你重新相信可能性的人」。這個人可能很樂觀、很有生命力，甚至有點孩子氣，但他靠近你之後，你會開始覺得世界沒有那麼沉重。對方可能會在你快放棄時，突然給你一句話、一個機會、一個介紹，讓命運重新轉動。幸運星的貴人常常不像貴人，反而像突然闖進你人生的路人。真正重要的，不是他替你完成什麼，而是他讓你重新敢期待未來。'},

  128:{name:'地球',emoji:'🌎',
    近況:'你最近正站在人生視野擴張的階段。很多過去讓你糾結的事，現在開始變得沒那麼重要。地球象徵「世界正在打開」。你可能會開始接觸新的圈子、新的價值觀，甚至突然發現自己原本相信的東西，其實只是很小的一部分。這段時間很適合旅行、學習、認識不同的人。宇宙正在把你從狹窄的世界裡慢慢拉出來。真正的成長，往往不是得到答案，而是發現世界比想像中更大。',
    挑戰:'地球最大的問題，是容易失去中心。當你開始接觸太多資訊、太多選擇時，你可能會突然不知道自己到底想要什麼。你最近很容易被外界影響，一下想改變人生，一下又懷疑自己。這段時間要小心「方向感崩潰」。世界很大沒錯，但不是每條路都適合你。真正重要的，不是一直往外看，而是不要在探索的過程裡，把最原本的自己弄丟。沒有根的人，再自由也會漂流。',
    貴人:'你的貴人是一個能帶你看見更大世界的人。他可能來自不同背景、不同文化，或擁有完全不同的人生經驗。跟他相處時，你會突然發現，原來人生還有別種活法。地球貴人最大的特徵，是拓展你的視野。他不一定直接幫助你成功，但會讓你的世界變大。你最近真正需要的，不只是安慰，而是一個能把你從舊世界帶出去的人。有些相遇，會直接改變一個人的宇宙。'},
  };





function getData(id){
  return DATA[id]||{
    name:`No.${String(id).padStart(3,'0')}`,
    emoji:'✨',
    近況:'###',挑戰:'###',貴人:'###'
  };
}

function cardImg(id){return `card_${String(id).padStart(3,'0')}.png`;}

// ══ 轉軸 ══
const CARD_H=233;
const colWidths=[164,170,164];
const speeds=[1.0,0.93,1.07];
const LAPS=[4,3,2];

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
const ids=Array.from({length:128},(_,i)=>i+1);
const seqs=LAPS.map(laps=>{
  let s=[];for(let l=0;l<laps;l++)s=s.concat(shuffle(ids));return s;
});
const tracks=[document.getElementById('t0'),document.getElementById('t1'),document.getElementById('t2')];
const reelEls=[document.getElementById('reel0'),document.getElementById('reel1'),document.getElementById('reel2')];

reelEls.forEach((r,i)=>r.style.width=colWidths[i]+'px');

seqs.forEach((seq,ri)=>{
  const tr=tracks[ri];
  [...seq,...seq].forEach(id=>{
    const d=document.createElement('div');
    d.className='card';
    const img=document.createElement('img');
    img.className='card-img';
    img.src=cardImg(id);
    img.alt='';
    img.draggable=false;
    d.appendChild(img);
    tr.appendChild(d);
  });
});

const loopPx=seqs.map(s=>s.length*CARD_H);
const pos=[0,0,0];
let lastTs=null;
let spinning=true;

function tick(ts){
  if(!spinning)return;
  if(lastTs===null)lastTs=ts;
  const dt=ts-lastTs;lastTs=ts;
  for(let ri=0;ri<3;ri++){
    pos[ri]+=dt*speeds[ri]*1.92;
    if(pos[ri]>=loopPx[ri])pos[ri]-=loopPx[ri];
    tracks[ri].style.transform=`translateY(-${pos[ri]}px)`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function getCenterIds(){
  const overlayH=699;
  const centerY=overlayH*0.41+77;
  return seqs.map((seq,ri)=>{
    const adjustedIdx=Math.floor((pos[ri]+centerY)/CARD_H)%seq.length;
    const safeIdx=((adjustedIdx%seq.length)+seq.length)%seq.length;
    return seq[safeIdx];
  });
}

// ══ Gacha ══
let currentIds=[1,2,3];

function doGacha(){
  if(!spinning)return;
  spinning=false;
  currentIds=getCenterIds();
  setTimeout(showPanel,700);
}

function showPanel(){
  const roleKeys=['近況','挑戰','貴人'];
  const roleLabel=['近況','挑戰','貴人'];

  const names=currentIds.map(id=>getData(id));
  document.getElementById('panel-names').textContent=
    names.map((d,i)=>`${roleLabel[i]} ${d.emoji}${d.name}`).join('  ✦  ');

  const row=document.getElementById('cards-row');
  row.innerHTML='';
  currentIds.forEach((id,i)=>{
    const d=getData(id);
    const card=document.createElement('div');
    card.className='result-card';
    const img=document.createElement('img');
    img.className='result-card-img';
    img.src=cardImg(id);img.alt=d.name;
    const lbl=document.createElement('div');
    lbl.className='result-card-label';
    lbl.textContent=roleLabel[i];
    const sub=document.createElement('div');
    sub.style.cssText='font-size:20px;color:#fff;font-weight:700;padding-bottom:10px;letter-spacing:1px;';
    sub.textContent=`${d.emoji} ${d.name}`;
    card.appendChild(img);card.appendChild(lbl);card.appendChild(sub);
    row.appendChild(card);
  });

  const area=document.getElementById('content-area');
  area.innerHTML='';
  currentIds.forEach((id,i)=>{
    const d=getData(id);
    const key=roleKeys[i];
    const block=document.createElement('div');
    block.className='reading-block';
    const isPlaceholder=d[key]==='###';
    block.innerHTML=`
      <div class="reading-who">${d.emoji} ${d.name} — ${key}</div>
      <div class="reading-text${isPlaceholder?' placeholder':''}">${d[key]}</div>
    `;
    area.appendChild(block);
    if(i<2){
      const hr=document.createElement('div');
      hr.style.cssText='height:1px;background:rgba(255,215,0,0.12);margin:22px 0;';
      area.appendChild(hr);
    }
  });
  area.scrollTop=0;

  document.getElementById('result-panel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closePanel(){
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  spinning=true;lastTs=null;
  requestAnimationFrame(tick);
}

function againGacha(){
  switchMusic();
  closePanel();
}

// ══ LINE 分享（簡短版） ══
function shareToLine(){
  const labels=['近況','挑戰','貴人'];
  const cards = currentIds.map((id,i)=>{
    const d = getData(id);
    return `${['🌅','⚡','🌟'][i]} ${labels[i]}｜${d.emoji} ${d.name}`;
  }).join('\n');
  const url = 'https://torihiplay.github.io/Mood-Gacha/';
  const msg = `🔮 心情拉霸機 · 命運揭示\n\n${cards}\n\n👇 換你試試 👇\n${url}`;
  window.open(`https://line.me/R/msg/text/?${encodeURIComponent(msg)}`, '_blank');
}

// ══ 16色編碼系統 ══
// 色相每22.5度一個，飽和度85%亮度55%，間距夠大壓縮後仍可辨識
const PALETTE_16=(()=>{
  const colors=[];
  for(let i=0;i<16;i++){
    const h=i*22.5;
    const s=0.85,l=0.55;
    const c=(1-Math.abs(2*l-1))*s;
    const x=c*(1-Math.abs((h/60)%2-1));
    const m=l-c/2;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x;}
    else if(h<120){r=x;g=c;}
    else if(h<180){g=c;b=x;}
    else if(h<240){g=x;b=c;}
    else if(h<300){r=x;b=c;}
    else{r=c;b=x;}
    colors.push([
      Math.round((r+m)*255),
      Math.round((g+m)*255),
      Math.round((b+m)*255)
    ]);
  }
  return colors;
})();

// id(1~128) → 固定兩色index
// 16×16=256種組合，足夠覆蓋128張牌且每個牌有唯一對應
function idToColorPair(id){
  const n=id-1; // 0~127
  const i1=n%16;
  const i2=Math.floor(n/16);
  return [i1,i2];
}

function colorToHex([r,g,b]){
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// ══ 儲存卡片（html2canvas 截 DOM，完全繞開 canvas taint） ══
async function saveCard() {
  const overlay = document.getElementById('card-preview-overlay');
  const previewImg = document.getElementById('card-preview-img');
  previewImg.src = '';
  overlay.classList.add('show');

  try {
    const card = buildShareCard();
    card.style.cssText += 'position:fixed;left:-9999px;top:0;z-index:-1;';
    document.body.appendChild(card);

    // 等圖片全部載入
    await Promise.all(
      Array.from(card.querySelectorAll('img')).map(img =>
        img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })
      )
    );
    // 再等一幀確保渲染
    await new Promise(r => requestAnimationFrame(r));

    const canvas = await html2canvas(card, {
      width: 1080,
      height: 580,
      scale: 1,
      useCORS: false,
      allowTaint: true,
      backgroundColor: null,
      logging: false
    });

    document.body.removeChild(card);
    previewImg.src = canvas.toDataURL('image/png');
  } catch (e) {
    console.error(e);
    document.body.querySelector('[style*="-9999px"]')?.remove();
    overlay.classList.remove('show');
    alert('卡片生成失敗：' + e.message);
  }
}

// ══ 建構分享卡片 DOM（1080×580，神秘占卜風） ══
function buildShareCard() {
  const labels = ['近況', '挑戰', '貴人'];
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const dateStr = `${now.getFullYear()} · ${pad(now.getMonth()+1)} · ${pad(now.getDate())}  ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const wrap = document.createElement('div');
  wrap.style.cssText = [
    'width:1080px','height:580px','overflow:hidden','box-sizing:border-box',
    'background:linear-gradient(135deg,#12090a 0%,#1c1005 35%,#221408 50%,#1c1005 65%,#12090a 100%)',
    'position:relative','font-family:serif','border-radius:18px',
    'border:2px solid rgba(180,130,40,0.55)'
  ].join(';');

  // 中央光暈
  const glow = el('div', 'position:absolute;inset:0;border-radius:18px;pointer-events:none;' +
    'background:radial-gradient(ellipse at 50% 45%,rgba(255,210,100,0.11) 0%,transparent 62%)');
  wrap.appendChild(glow);

  // 內框線
  wrap.appendChild(el('div',
    'position:absolute;inset:9px;border-radius:12px;pointer-events:none;' +
    'border:1px solid rgba(255,210,100,0.18)'));

  // 四角裝飾（純 CSS border）
  [
    'top:14px;left:14px;border-top:2px solid rgba(200,160,60,0.6);border-left:2px solid rgba(200,160,60,0.6)',
    'top:14px;right:14px;border-top:2px solid rgba(200,160,60,0.6);border-right:2px solid rgba(200,160,60,0.6)',
    'bottom:14px;left:14px;border-bottom:2px solid rgba(200,160,60,0.6);border-left:2px solid rgba(200,160,60,0.6)',
    'bottom:14px;right:14px;border-bottom:2px solid rgba(200,160,60,0.6);border-right:2px solid rgba(200,160,60,0.6)'
  ].forEach(s => wrap.appendChild(el('div',
    `position:absolute;width:28px;height:28px;pointer-events:none;${s}`)));

  // 標題區（上方橫線用 border-top）
  const header = el('div',
    'text-align:center;padding:28px 60px 16px;' +
    'border-bottom:1px solid rgba(200,160,60,0.25);margin:0 50px;');
  header.innerHTML = `
    <div style="font-size:34px;font-weight:900;color:#f5d97a;letter-spacing:4px;margin-bottom:7px;
      text-shadow:0 0 22px rgba(255,200,80,0.45);">✦ 心情拉霸機 · 命運揭示 ✦</div>
    <div style="font-size:17px;color:rgba(220,180,90,0.52);letter-spacing:3px;">${dateStr}</div>
  `;
  wrap.appendChild(header);

  // 三張牌列
  const row = el('div',
    'display:flex;justify-content:center;gap:28px;padding:20px 52px 0;align-items:flex-start;');

  currentIds.forEach((id, i) => {
    const d = getData(id);
    // 直接取 DOM 已顯示的圖片 src（同一張圖，不重新請求）
    const domImg = document.querySelectorAll('#cards-row .result-card-img')[i];
    const imgSrc = domImg ? domImg.src : cardImg(id);

    const col = el('div', 'display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;max-width:272px;');

    // 角色標籤
    col.appendChild(el('div',
      'font-size:19px;color:rgba(255,210,100,0.68);letter-spacing:3px;font-weight:700;',
      labels[i]));

    // 牌框 + 圖片
    const frame = el('div',
      'width:228px;height:228px;border-radius:12px;overflow:hidden;' +
      'border:1.5px solid rgba(180,130,40,0.52);background:#08050a;' +
      'box-shadow:0 0 20px rgba(180,120,20,0.14),inset 0 0 14px rgba(0,0,0,0.45);' +
      'position:relative;');
    const img = document.createElement('img');
    img.src = imgSrc;
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
    // 牌圖暗角疊加
    const vignette = el('div',
      'position:absolute;inset:0;pointer-events:none;' +
      'background:linear-gradient(to bottom,rgba(0,0,0,0.22) 0%,transparent 28%,transparent 72%,rgba(0,0,0,0.32) 100%)');
    frame.appendChild(img);
    frame.appendChild(vignette);
    col.appendChild(frame);

    // 牌名
    col.appendChild(el('div',
      'font-size:21px;color:#f0e0b0;font-weight:700;letter-spacing:1px;text-align:center;' +
      'text-shadow:0 0 10px rgba(255,180,60,0.28);',
      `${d.emoji} ${d.name}`));

    row.appendChild(col);
  });
  wrap.appendChild(row);

  // 底部：分隔線 + 色塊
  const footer = el('div',
    'position:absolute;bottom:0;left:0;right:0;height:56px;' +
    'display:flex;align-items:center;justify-content:center;gap:0;' +
    'border-top:1px solid rgba(200,160,60,0.2);');

  const colorsWrap = el('div', 'display:flex;gap:5px;align-items:center;');
  currentIds.forEach((id, gi) => {
    const [c1, c2] = idToColorPair(id);
    [c1, c2].forEach((ci, j) => {
      const b = el('div',
        `width:50px;height:18px;border-radius:4px;background:${colorToHex(PALETTE_16[ci])};` +
        `border:1px solid rgba(255,255,255,0.1);` +
        (j === 1 && gi < 2 ? 'margin-right:18px;' : ''));
      colorsWrap.appendChild(b);
    });
  });

  const wm = el('div',
    'position:absolute;right:26px;bottom:14px;' +
    'font-size:13px;color:rgba(200,170,80,0.2);letter-spacing:1px;',
    'mood-gacha');

  footer.appendChild(colorsWrap);
  wrap.appendChild(footer);
  wrap.appendChild(wm);

  return wrap;
}

// ── 輔助：快速建立帶 style 的 div ──
function el(tag, style, text) {
  const e = document.createElement(tag);
  if (style) e.style.cssText = style;
  if (text !== undefined) e.textContent = text;
  return e;
}

function closeCardPreview(){
  document.getElementById('card-preview-overlay').classList.remove('show');
}
