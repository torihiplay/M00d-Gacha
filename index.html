<script>
// ══ 星空畫布 ══
(function(){
  const canvas=document.getElementById('stars-canvas');
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize();
  window.addEventListener('resize',resize);
  const stars=Array.from({length:160},()=>({
    x:Math.random(),y:Math.random(),
    r:Math.random()*1.4+0.3,
    a:Math.random(),da:(Math.random()-0.5)*0.006
  }));
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    stars.forEach(s=>{
      s.a=Math.max(0.05,Math.min(1,s.a+s.da));
      if(s.a<=0.05||s.a>=1)s.da*=-1;
      ctx.beginPath();
      ctx.arc(s.x*canvas.width,s.y*canvas.height,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(200,190,255,${s.a})`;
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

// ══ 迎賓畫面 ══
function enterMain(){
  playMusic(pickRandomTrack());
  const w=document.getElementById('welcome');
  w.classList.add('fade-out');
  setTimeout(()=>w.style.display='none',800);
}

// ══ 手機滿版縮放 ══
function scaleApp(){
  const app=document.getElementById('app');
  const scale=window.innerWidth/1080;
  app.style.transform=`scale(${scale})`;
  app.style.transformOrigin='top left';
  app.style.width='1080px';
  app.style.height='1920px';
  document.body.style.height=`${1920*scale}px`;
  document.body.style.overflowX='hidden';
}
scaleApp();
window.addEventListener('resize',scaleApp);
window.addEventListener('orientationchange',()=>{setTimeout(scaleApp,200);});

// ══ 音樂系統 ══
const MUSIC_FILES=['1.wav','2.wav','3.wav'];
let currentAudio=null;
let currentTrackIndex=-1;

function pickRandomTrack(){return Math.floor(Math.random()*3);}

function playMusic(trackIndex){
  if(currentAudio){currentAudio.pause();currentAudio.src='';currentAudio=null;}
  currentTrackIndex=trackIndex;
  const audio=new Audio(MUSIC_FILES[trackIndex]);
  audio.loop=true;audio.volume=0.7;
  audio.play().catch(()=>{
    document.addEventListener('touchstart',()=>audio.play(),{once:true});
    document.addEventListener('click',()=>audio.play(),{once:true});
  });
  currentAudio=audio;
}

function switchMusic(){playMusic(pickRandomTrack());}

// ══ 解析資料 ══
const DATA={
  1:{name:'幸運星',emoji:'🌟',
    近況:'你最近正在進入一段「微小幸運開始聚集」的時期。有些事情表面看起來只是巧合，但其實命運已經悄悄偏向你。你可能會發現，原本卡住的人突然回訊息、原本不順的事情突然出現破口，甚至只是走進某個地方，都有種被宇宙偷偷推了一下的感覺。這不是暴富型的幸運，而是「路開始打開」的幸運。很多人抽到幸運星時，人生都正站在下一階段的入口，只是還沒真正意識到。',
    挑戰:'幸運星真正的問題，是容易讓人誤以為「只要等運氣來就好」。你最近最大的挑戰，其實是猶豫。你可能正在等待某個完美時機、完美答案、完美情緒，但宇宙現在給你的不是結果，而是門縫。如果你一直停在原地分析，幸運就會像流星一樣擦身而過。這段時間尤其容易因為害怕失敗，而假裝自己還沒準備好。有些事情其實不用百分之百確定，你真正缺少的，是往前一步的勇氣。',
    貴人:'你的貴人通常不是最強勢的人，而是「會讓你重新相信可能性的人」。這個人可能很樂觀、很有生命力，甚至有點孩子氣，但他靠近你之後，你會開始覺得世界沒有那麼沉重。對方可能會在你快放棄時，突然給你一句話、一個機會、一個介紹，讓命運重新轉動。幸運星的貴人常常不像貴人，反而像突然闖進你人生的路人。真正重要的，不是他替你完成什麼，而是他讓你重新敢期待未來。'},
  2:{name:'烈火',emoji:'🔥',
    近況:'你最近像站在高溫燃燒的中心。很多事情正在加速，不論是情緒、人際、工作還是內心慾望，都有種快要壓不住的感覺。烈火出現時，通常代表人生已經進入「不能再假裝平靜」的階段。有些人會突然做出重大決定，有些人會突然爆氣離開一段關係，也有人會開始瘋狂投入某件事。你現在的能量其實很強，但也很危險，因為這股火如果沒有出口，就可能先燒到自己。',
    挑戰:'烈火最大的挑戰，是情緒失控後留下的後果。你最近可能特別容易煩躁、急、沒有耐性，甚至別人一句話就能點燃你。真正危險的不是衝突，而是你內心早就累積太久的壓力。你現在像一座已經過熱的引擎，看起來還能運作，但其實快要爆炸。這段時間不要急著證明自己，也不要在最憤怒的時候做決定。有些關係不是壞掉，而是被高溫燒傷。你真正需要的，不是壓抑，而是找到能安全燃燒的方向。',
    貴人:'烈火的貴人通常是「敢推動你的人」。這個人可能講話直接、不溫柔，甚至第一次接觸時會讓你有壓迫感，但他會逼你離開停滯狀態。對方像一把點火器，把你原本不敢碰的事情全部點亮。有些人抽到烈火貴人時，會遇到強勢主管、行動力極高的朋友，或某個突然闖進人生的角色。這個人不一定會安慰你，但他會讓你開始動起來。因為你的命運現在需要的，不是保護，而是推進。'},
  3:{name:'浪潮',emoji:'🌊',
    近況:'你最近的人生正在進入一種「流動狀態」。很多事情不再固定，情緒也比以前更敏感。你可能會突然懷念某些過去的人，突然對現在的生活感到陌生，或開始產生想離開某個環境的念頭。浪潮並不代表壞事，它更像命運在提醒你：你已經不是原本那個人了。有些關係正在退潮，有些新的方向卻正在慢慢靠近。現在的你，其實正站在變化前的海面，只是還沒真正看清下一座岸。',
    挑戰:'浪潮最大的挑戰，是太容易被外界情緒牽動。你最近可能會發現，別人的一句話、一個態度，就能影響你整天的狀態。你像海水一樣吸收太多東西，最後反而分不清哪些情緒是自己的。這段時間尤其要小心情緒疲勞與內耗。有些事情不是你的責任，但你卻默默背了起來。浪潮也代表猶豫，你可能一直在「想清楚再決定」，但海水不會因為你準備好才開始流動。真正的課題，是學會在不確定裡前進。',
    貴人:'你的貴人是那種「讓你能安心做自己的人」。對方可能很安靜、很溫柔，不一定特別耀眼，但他靠近時，你的情緒會慢慢穩定下來。浪潮型貴人很像避風港，會在你最混亂的時候，接住你那些沒說出口的疲憊。有時這個人甚至不用做什麼，只是陪伴，就已經足夠。你最近真正需要的，不是替你衝鋒的人，而是能讓你不用硬撐的人。因為有些海浪，只有在安心時，才會慢慢平靜。'},
  4:{name:'彩虹',emoji:'🌈',
    近況:'彩虹出現時，通常代表你剛經歷過某種內在風暴。也許外表看起來沒事，但你的情緒其實已經下過一場很大的雨。現在的你，正在進入「重新看見希望」的階段。有些原本以為過不去的事情，突然開始出現新的角度；有些原本讓你痛苦的人，也慢慢失去控制你的力量。彩虹不是瞬間逆轉人生，而是宇宙在提醒你：最黑的那段路，其實已經快走完了。你最近會開始重新相信未來。',
    挑戰:'彩虹最大的挑戰，是太快以為一切都好了。你可能很想趕快離開低潮，於是逼自己樂觀、逼自己放下，但有些傷口其實還沒真正癒合。這段時間容易出現「表面恢復正常，內心卻還在流血」的狀態。你也可能會因為害怕再次失望，而不敢真正期待幸福。彩虹的另一面，其實是短暫，它提醒你：希望不是永遠存在，而是需要你親手留住。真正的課題，不是等待天空放晴，而是學會帶著傷繼續往前。',
    貴人:'彩虹的貴人通常是「把你從黑暗裡拉出來的人」。這個人不一定懂所有道理，但他會在你最灰暗的時候，讓你重新看見生活的顏色。對方可能很會鼓勵人、很有感染力，也可能只是剛好在你最低潮時出現。你會發現，和他相處後，原本壓得你喘不過氣的事情，好像突然沒那麼可怕了。彩虹型貴人帶來的，不只是幫助，而是一種重新相信世界的能力。因為有時候，真正救人的不是答案，而是希望。'},
  5:{name:'鬼打牆',emoji:'👻',
    近況:'你最近的人生像陷進某種循環裡。很多事情明明努力過、思考過，卻還是回到原點。你可能開始懷疑自己是不是做錯了什麼，甚至有種「不管怎麼選都不對」的感覺。鬼打牆通常出現在命運卡關期，它不是懲罰，而是一種強迫停下來的訊號。有些人抽到這個符號時，會一直重複遇到類似的人、類似的問題、類似的情緒。宇宙不是不讓你前進，而是有些東西，你還沒真正看清。',
    挑戰:'鬼打牆最大的挑戰，是你會開始懷疑自己的直覺。你最近可能一直在找答案，但越找越亂。真正困住你的，很多時候不是外界，而是你不願承認的內心。也許你早就知道某段關係不對、某條路走不通，但你還在期待奇蹟發生。這段時間容易陷入過度分析、過度回想、過度後悔。你像在迷宮裡繞圈，但出口其實一直都存在。真正可怕的不是迷路，而是你開始習慣待在迷路裡。',
    貴人:'鬼打牆的貴人通常是「點醒你的人」。這個人不一定溫柔，甚至可能一開始讓你不舒服，但他會直接拆穿你一直逃避的東西。對方像一面鏡子，把你不想看的真相照出來。有時是一句話，有時是一場衝突，有時甚至只是某個突然離開你的人。鬼打牆型貴人不會替你開門，但會讓你終於發現門其實就在旁邊。因為你現在真正需要的，不是安慰，而是清醒。'},
  6:{name:'財神到',emoji:'💰',
    近況:'你最近正在進入一段「資源開始靠近」的時期。財神到不一定代表立刻暴富，而是代表你的價值正在被看見。你可能會開始收到新的合作、賺錢機會、別人的主動邀請，或者突然發現某項能力其實很值錢。這是一種能量回流的象徵，過去你累積的東西，正在慢慢產生結果。不過財神到也代表慾望變強，你會開始更在意未來、成就與安全感。這段時間，很多選擇都會直接影響你接下來的命運方向。',
    挑戰:'財神到最大的挑戰，是容易被「得到更多」吞沒。你最近可能開始變得焦慮，明明已經比以前好了，卻還是覺得不夠。這段時間特別容易陷入比較、過度工作、害怕失去機會。你可能會把所有事情都變成利益計算，最後反而失去真正重要的東西。財神的另一面，其實是考驗。宇宙現在正在看：當機會真的來了，你會被慾望控制，還是能守住自己的核心。因為不是所有賺得到的東西，都值得你交換人生。',
    貴人:'財神到的貴人通常是「能帶你進入新世界的人」。對方可能有人脈、資源、商業頭腦，或單純比你更早看懂機會。他會讓你接觸到原本碰不到的圈子，也可能改變你對金錢的想法。這種貴人不一定感性，但非常實際。你會發現，他出現後，你開始敢把夢想當成真正能實現的事情。財神型貴人最重要的，不只是給你錢，而是讓你看見自己的價值原來可以被世界交換。'},
  7:{name:'慢龜',emoji:'🐢',
    近況:'你最近的人生節奏，正在被迫慢下來。很多事情不像以前那樣快速推進，甚至有種停滯感。你可能會懷疑自己是不是落後了，看著別人一直往前，而自己還卡在原地。但慢龜出現時，通常代表宇宙正在幫你避開某種危險。現在這段時間，看似延遲，其實是在重新校正方向。有些事情如果太快得到，反而會在未來崩掉。你現在需要的，不是衝刺，而是穩定地活下來。',
    挑戰:'慢龜最大的挑戰，是焦慮。你最近很容易因為看不到成果，就開始否定自己。尤其當別人一直進步、一直改變時，你會更懷疑自己是不是太慢了。但真正危險的，其實是你因為害怕落後，而亂改方向。這段時間要小心過度比較與急著證明自己。慢並不代表失敗，只是你的命運不是走爆發路線。有些人是煙火，有些人是長河。你現在最大的課題，是學會相信那些還沒開花的累積。',
    貴人:'慢龜的貴人通常是「能讓你穩下來的人」。這個人可能成熟、有耐心，甚至比你更慢，但他不會被外界節奏輕易影響。和他相處時，你會慢慢停止那種一直想追趕世界的疲憊感。對方可能不會突然改變你的人生，但會陪你把基礎真正打穩。慢龜型貴人很像長途旅伴，他不一定最耀眼，卻是最後還留在你身邊的人。因為有些命運，不是靠爆衝完成，而是靠長久支撐。'},
  8:{name:'獅王貴人',emoji:'🦁',
    近況:'你最近正在靠近一股很強的能量。這段時間，你可能會開始接觸權威人物、領導型角色，或突然被推到更顯眼的位置。獅王出現時，通常代表命運正在逼你「變大」。你不能再像以前那樣躲在人群後面，因為很多事情已經開始需要你站出來。你內心其實知道，自己正在進入新的階段，只是還沒完全適應那種被看見的壓力。現在的你，正在學習怎麼駕馭自己的力量。',
    挑戰:'獅王最大的挑戰，是自尊與控制慾。你最近可能會很在意別人的眼光，也容易因為被否定而情緒受傷。有些人抽到這個符號時，會開始陷入「一定要證明自己」的狀態。你現在最大的危險，不是能力不足，而是太害怕失敗。這段時間也要小心權力衝突，尤其在人際與工作上。獅子的力量很強，但如果只剩下咆哮，就會變成孤獨。真正的王者，不是壓過所有人，而是能穩住整個局面。',
    貴人:'獅王貴人代表你會遇到「真正有份量的人」。對方可能是主管、前輩、老師，或某個本身就很有影響力的人。他不一定對每個人都好，但會特別注意到你的潛力。這種人通常眼光很高，也不太會隨便誇獎人，所以一旦願意拉你一把，影響會非常大。獅王型貴人有時候甚至像命運中的伯樂，他會逼你離開舒適圈，讓你開始相信自己真的能走到更高的位置。'},
  9:{name:'毒菇',emoji:'🍄',
    近況:'你最近正在靠近某種「表面誘人、實際危險」的狀態。有些東西看起來很美、很輕鬆、很讓人心動，但你的直覺其實早就隱隱不安。毒菇出現時，通常代表命運正在測試你的辨識能力。你可能會遇到看似完美的人際、合作、感情或機會，但背後其實藏著代價。這段時間尤其容易被短暫快樂吸引，等回過神時，才發現自己已經陷進去。真正危險的東西，往往不是恐怖，而是太迷人。',
    挑戰:'毒菇最大的挑戰，是你會開始合理化危險。你明明感覺不對，卻還是不斷替對方找理由；明明知道某條路有問題，卻因為捨不得而繼續往前。你最近很容易陷入「再一下就好」的循環。這個符號也代表精神消耗，有些東西正在慢慢侵蝕你的能量，但它不會立刻爆炸，而是讓你逐漸麻木。現在真正需要小心的，不是敵人，而是那些讓你失去判斷力的誘惑。因為最深的陷阱，通常都長得像禮物。',
    貴人:'毒菇的貴人通常是「把你拉回現實的人」。這個人可能很理性、很冷靜，甚至有點掃興，但他會在你快陷進幻覺時提醒你真相。對方不一定懂浪漫，也不一定會順著你的情緒，但他能看見你沒看見的危險。有些人抽到毒菇貴人時，會遇到那種一句話就突然點醒自己的人。這種貴人的存在，不是讓你舒服，而是避免你被吞沒。因為有時候，真正的保護不是安慰，而是阻止你繼續沉下去。'},
  10:{name:'變臉',emoji:'🎭',
    近況:'你最近正在經歷一段「身份切換期」。你可能開始在不同人面前展現不同樣子，甚至連自己都不確定哪個才是真正的自己。變臉出現時，通常代表人生角色正在改變。有人會突然成熟、突然冷淡、突然開始隱藏情緒，也有人會發現自己其實早就戴著面具活了很久。你最近很容易感到疲憊，因為你一直在配合不同世界的期待。這個符號不是虛假，而是提醒你：你的人生已經走到必須重新定義自己的階段。',
    挑戰:'變臉最大的挑戰，是你可能會忘記真實情緒。你最近很容易進入「只要演好就好」的狀態，把很多痛苦藏起來，久了連自己都相信那張面具。有些關係其實早就不對勁，但你仍然維持和平的樣子；有些夢想其實已經不適合你，但你還在演那個舊角色。這段時間尤其要小心情緒斷裂。因為一個人最危險的時候，不是崩潰，而是已經感覺不到自己。你真正需要的，不是演得更好，而是敢不敢停下來面對真心。',
    貴人:'變臉的貴人通常是「能看穿你的人」。對方可能不會被你的表面騙過，甚至第一次見面就察覺你在隱藏什麼。他不一定會拆穿你，但會讓你慢慢放下防備。你會發現，和這個人在一起時，你不需要刻意表現、不需要扮演任何角色。變臉型貴人很少見，因為真正能接受真實模樣的人並不多。這個人的出現，會讓你重新想起：原來活著，不一定非得一直戴著面具。'},
  11:{name:'休眠',emoji:'💤',
    近況:'你最近的人生像進入了低耗能模式。很多事情沒有明顯進展，你的情緒、動力甚至社交慾望都開始下降。休眠並不代表失敗，而是靈魂正在進行某種深層修復。你可能會突然想遠離人群、關掉通知、停止解釋，甚至對過去很在意的事情失去反應。這個符號通常出現在「消耗過度之後」。宇宙現在不是要你衝，而是強迫你停下來。因為有些疲憊，已經不是睡一覺就能恢復。',
    挑戰:'休眠最大的挑戰，是你會誤以為自己廢掉了。當別人一直前進、一直發光時，你很容易開始責怪自己的停滯。你可能會逼自己重新振作、重新熱情，但身體與情緒其實早就超載。這段時間尤其要小心假性恢復。有些人表面恢復正常，內心卻還是空的。休眠真正可怕的地方，不是慢，而是你一直忽略自己的耗損。現在的課題不是重新燃燒，而是承認：你真的累了。',
    貴人:'休眠的貴人通常是「不會逼你的人」。這個人可能很安靜、很穩，甚至不太干涉你的生活，但他會讓你感到安全。你不需要在他面前假裝有精神，也不用努力證明自己很好。對方像一個能量避難所，讓你終於能暫時卸下所有防備。有些人抽到休眠貴人時，會遇到一個願意陪你沉默的人。這種人不一定改變你的命運，但他會讓你重新有力氣活下去。'},
  12:{name:'閃電',emoji:'⚡',
    近況:'你最近的人生正在進入一段「瞬間改變期」。很多事情可能毫無預警地發生，一通電話、一個消息、一場相遇，就足以徹底改變你的方向。閃電出現時，通常代表命運不再給你慢慢準備的時間。你可能開始感受到強烈不安，也可能突然充滿前所未有的衝勁。這個符號帶有強烈覺醒感，它像黑夜裡突然劃開天空的光，逼你看見那些原本一直逃避的真相。',
    挑戰:'閃電最大的挑戰，是變化太快。你最近可能會突然失控、突然決定、突然離開，事後才發現自己根本還沒準備好。這段時間尤其要小心衝動與極端情緒。閃電也代表斷裂，有些事情可能會突然結束，某些人會突然消失，甚至原本穩定的東西也可能瞬間翻盤。你真正要學的，不是控制所有變化，而是學會在混亂裡保持清醒。因為命運現在正在加速，而你不能只靠過去的方法活下去。',
    貴人:'閃電的貴人通常是「突然出現的人」。對方可能很有行動力、很直接，甚至像闖入你人生一樣毫無預警。他會帶來新的資訊、新的世界、新的可能性。有些人抽到閃電貴人時，會在某個極短瞬間遇到改變人生的人。這種貴人不一定陪你很久，但影響非常強烈。他像一道真正的閃電，把你原本灰暗的人生瞬間照亮。你後來可能會發現，很多改變，其實都是從那次相遇開始。'},
  13:{name:'月光',emoji:'🌙',
    近況:'你最近正進入一段非常內在的時期。很多事情開始不再靠理性運作，而是靠感覺、直覺與潛意識推動。你可能變得比以前更敏感、更容易想很多，也更容易在夜晚突然情緒翻湧。月光出現時，通常代表有些答案只能在安靜裡找到。你最近會開始重新回頭看過去，想起某些舊人、舊傷、舊遺憾。這不是倒退，而是你的靈魂正在整理那些還沒真正放下的東西。',
    挑戰:'月光最大的挑戰，是幻想與現實開始混在一起。你最近可能會過度腦補、過度猜測，甚至把很多沉默當成訊號。這段時間尤其容易陷入情緒漩渦，一邊想離開，一邊又放不下。月亮的能量會放大孤獨感，也會讓你開始看見自己不願面對的黑暗面。真正危險的，不是情緒本身，而是你開始沉迷於那些模糊不清的想像。因為有些事情，不是神秘，而是你不敢確認真相。',
    貴人:'月光的貴人通常是「懂你情緒的人」。對方可能安靜、敏感、有很強的共感能力。他不一定會給你解答，但會在你最混亂的時候理解你的沉默。有些人抽到月光貴人時，會遇到像靈魂同類一樣的人。你甚至不用說太多，對方就能察覺你的疲憊。這種人不一定帶你衝向成功，但會讓你慢慢願意相信：原來自己的脆弱，也能被溫柔接住。'},
  14:{name:'太陽',emoji:'☀️',
    近況:'你最近正在進入能量重新回升的階段。很多原本壓抑、模糊的事情，開始慢慢變清楚。太陽出現時，通常代表命運準備把你推回世界中心。你可能會開始變得忙碌、被看見，甚至重新找回某種久違的熱情。有些人抽到太陽時，會突然產生很強的行動力，像終於從長夜醒來。這不是單純的好運，而是一種生命力回歸。宇宙正在提醒你：你還沒有真正熄滅。',
    挑戰:'太陽最大的挑戰，是過度燃燒自己。你最近很容易進入「一定要把一切做好」的狀態，不知不覺把所有責任都扛在身上。這段時間尤其要小心外強內空。很多人看到你發光，卻不知道你其實已經快沒電。太陽也代表曝光，有些事情會被放大，包括你的壓力與脆弱。你現在真正需要學的，不是一直照亮別人，而是允許自己偶爾躲進陰影休息。因為太陽再強，也有落下的時候。',
    貴人:'太陽的貴人通常是「會給你力量的人」。對方可能很開朗、有感染力，甚至像一顆行走的小太陽。他靠近時，你會開始重新相信自己。這種人很少停留在負能量裡，會自然地把你往更大的世界帶。太陽型貴人不只是陪伴，而是喚醒。他會讓你發現，原來自己還有很多沒用完的力量。有時候，真正改變人生的人，不是替你解決問題，而是讓你重新想活得更耀眼。'},
  15:{name:'蝴蝶',emoji:'🦋',
    近況:'你最近正站在人生的蛻變期。很多舊的身份、舊的習慣、舊的關係，正在慢慢脫落。蝴蝶出現時，通常代表你已經不適合繼續待在原本的世界裡。你可能會突然開始改變外表、想法、生活方式，甚至連朋友都感覺你變了。這不是一時衝動，而是內在已經發生轉化。現在的你，就像正在破繭的生物，雖然還不穩定，但已經回不去以前的樣子。',
    挑戰:'蝴蝶最大的挑戰，是轉變過程的孤獨。你最近可能會發現，很多人開始不理解你，甚至有人希望你變回原本的模樣。這段時間容易出現身份混亂，你會懷疑自己到底是不是做錯了選擇。蛻變從來都不好看，因為它伴隨失去。你可能正在失去熟悉感、失去安全圈，甚至失去某些舊關係。真正困難的，不是改變，而是接受：有些人只能陪你走到上一個版本的人生。',
    貴人:'蝴蝶的貴人通常是「看見你成長的人」。對方不一定會保護你，但他會鼓勵你繼續變化。這個人可能本身也經歷過很大的轉變，所以他不會害怕你的改變。有些人抽到蝴蝶貴人時，會遇到一個讓自己更想成為真正自己的存在。你會發現，在他面前，你不用退回舊模樣。這種人像風一樣，雖然抓不住，卻會陪你飛過整個轉變期。'},
  16:{name:'神龍',emoji:'🐉',
    近況:'你最近正在靠近某種巨大的命運力量。神龍出現時，通常代表人生已經開始進入「大局變動期」。很多事情表面看起來只是巧合，但背後其實正在重新排列。你可能會突然感覺到一股強烈召喚，像命運一直逼你往某個方向前進。這段時間，你的直覺會特別強，也容易遇到帶有宿命感的人事物。神龍不是平凡的符號，它通常出現在人生即將升階的人身上。',
    挑戰:'神龍最大的挑戰，是力量失控。你最近可能開始變得強勢、執著，甚至對某些目標產生近乎瘋狂的執念。這段時間很容易進入「非贏不可」的狀態，最後反而把自己困住。神龍也代表壓力，你可能背負很多期待，久了連脆弱都不敢表現。真正危險的，不是力量太小，而是你忘了怎麼溫柔。因為龍一旦只剩下征服，就會開始失去人性。',
    貴人:'神龍的貴人通常是「能看見你潛力的人」。對方可能地位很高、眼界很大，甚至本身就帶有強烈氣場。他不會把你當普通人對待，而是會直接要求你成長。這種貴人像命運派來的引路者，會把你推進更大的世界。你可能一開始會害怕他，但後來會發現，他其實是在逼你成為真正的自己。因為有些人不是來安慰你的，而是來喚醒你體內那條沉睡很久的龍。'},
  17:{name:'幸運草',emoji:'🍀',
    近況:'你最近正在進入一段「微妙轉運期」。很多事情還沒完全改變，但空氣已經開始不一樣了。你可能會發現，原本一直失敗的地方突然出現機會，或某些差點錯過的人事物，竟然又重新回到你面前。幸運草代表的不是轟轟烈烈的大運，而是那些藏在細節裡的命運偏移。你最近的人生像風開始轉向，有些原本緊閉的門，正在悄悄鬆動。這通常是宇宙在告訴你：你快走出低谷了。',
    挑戰:'幸運草最大的挑戰，是你容易把好運當成理所當然。你最近可能太專注在缺少什麼，反而忽略了其實很多東西正在慢慢靠近。這段時間也容易因為害怕失去，而不敢真正相信幸運。有些人抽到幸運草時，反而會開始焦慮，因為越幸福，越怕下一秒被收走。你真正需要面對的，不是運氣夠不夠，而是你敢不敢接住那些好的東西。因為有時候，人最大的不幸，是早已習慣失望。',
    貴人:'幸運草的貴人通常是「帶來好氣場的人」。對方可能沒有特別強勢，也不是什麼大人物，但他靠近之後，你的人生就開始慢慢變順。這種人很像命運中的小幸運，會在你最需要時剛好出現。有時是一個介紹、一句提醒、一個突如其來的陪伴。幸運草型貴人最特別的地方，是他不會讓你壓力很大，反而會讓你覺得世界沒有那麼難。因為真正的幸運，很多時候其實是「剛好有人在」。'},
  18:{name:'鑽石',emoji:'💎',
    近況:'你最近正在進入一段「價值覺醒期」。很多事情開始逼你重新思考：你真正值得的是什麼？你可能會突然不想再委屈、不想再廉價付出，也開始對某些關係失去耐心。鑽石出現時，通常代表你的內在正在變硬、變穩、變得更清楚。這不是冷漠，而是一種終於看見自身價值的過程。你最近可能會開始拒絕不對等的人事物，因為你的靈魂已經不願意再被隨便對待。',
    挑戰:'鑽石最大的挑戰，是過度封閉自己。你最近可能開始築起高牆，不再輕易相信別人。雖然這讓你比較不容易受傷，但也會慢慢失去柔軟。這段時間特別容易出現「我不需要任何人」的狀態，可真正的問題不是獨立，而是你害怕再次失望。鑽石雖然堅硬，卻也是孤獨的。你現在真正需要學的，不只是保護自己，而是分辨誰值得你卸下防備。因為不是每個靠近你的人，都想傷害你。',
    貴人:'鑽石的貴人通常是「真正看得懂你價值的人」。這個人不會把你當消耗品，也不會理所當然地享受你的付出。他可能很成熟、眼光很好，甚至比你更早看見你的能力。你會發現，在他面前，你不用拼命證明自己。鑽石型貴人很像收藏家，他不是因為你發光才靠近，而是知道你本來就珍貴。這種人的出現，會讓你第一次真正感覺到：原來被珍惜，是這種感覺。'},
  19:{name:'花開',emoji:'🌺',
    近況:'你最近的人生正在慢慢進入盛開期。有些過去一直默默累積的東西，開始被世界看見。花開出現時，通常代表你的魅力、能量與存在感正在提升。你可能會發現，最近比較容易被注意、被喜歡，甚至某些停滯很久的事情也開始流動。這不一定是愛情，也可能是人生終於開始「有顏色」。你內心其實已經悄悄變了，只是還沒完全意識到：你正在成為新的自己。',
    挑戰:'花開最大的挑戰，是太害怕凋謝。你最近可能會開始在意別人的眼光，也容易因為短暫失去關注而失落。這段時間尤其容易出現「一定要維持美好狀態」的壓力。你可能會過度包裝自己，或害怕讓人看見脆弱。花開的另一面，其實是脆弱，因為越美的東西，越容易被期待。你真正需要學會的，不是永遠盛開，而是接受自己也會有枯萎的時候。因為真正的生命力，不只存在於漂亮的瞬間。',
    貴人:'花開的貴人通常是「願意欣賞你的人」。這個人不一定會改變你的命運，但他會讓你重新相信自己的光。對方可能很溫柔、很有美感，也很懂得鼓勵人。有些人抽到花開貴人時，會遇到一個總能在低潮時提醒自己價值的人。這種人像陽光一樣，不會強迫你開花，卻會讓你自然長出新的模樣。因為有時候，人真正需要的，不是批評，而是被好好看見。'},
  20:{name:'狡狐',emoji:'🦊',
    近況:'你最近正在進入一段需要高度觀察力的時期。很多事情表面平靜，但底下其實暗潮洶湧。狡狐出現時，通常代表你周圍有人正在隱藏真實意圖，也可能是你自己開始變得更有防備。你最近會特別敏銳，能感覺到哪些話是真的、哪些只是演戲。這不是多疑，而是直覺正在升級。現在的你像站在森林邊緣，知道不能再單純往前衝，因為有些笑容背後，其實藏著獠牙。',
    挑戰:'狡狐最大的挑戰，是過度猜測與試探。你最近可能很難完全相信別人，也容易陷入心理戰。這段時間特別容易出現「明明沒事，卻一直懷疑」的狀態。你可能會用冷淡保護自己，甚至故意不表態，想先看清別人。但真正危險的，不只是別人的算計，而是你開始習慣用懷疑看世界。狡狐的能量很聰明，卻也容易孤獨。因為當一個人太清醒時，就很難再輕鬆相信任何溫柔。',
    貴人:'狡狐的貴人通常是「比你更聰明的人」。對方可能城府深、觀察力強，甚至有點神秘，但他能幫你避開很多陷阱。這種人不一定溫暖，卻非常可靠。你會發現，他總能提前察覺危險，也知道誰值得靠近。狡狐型貴人很像黑夜裡的引路者，不會替你戰鬥，但會教你怎麼在複雜世界活下去。因為有些時候，真正救人的不是善良，而是清醒。'},
  21:{name:'命中',emoji:'🎯',
    近況:'你最近的人生正在進入「目標聚焦期」。很多模糊的東西開始變清楚，你心裡其實已經知道自己真正想要什麼。命中出現時，通常代表命運正在逼你做選擇。你可能突然對某件事產生極強執念，也可能開始覺得不能再浪費時間。這段時間，你的能量會特別集中，像箭已經拉滿，只差最後放手。宇宙正在把你的注意力收回來，因為真正重要的東西，已經快出現在眼前。',
    挑戰:'命中最大的挑戰，是過度執著結果。你最近可能太想成功、太想得到答案，以至於開始失去彈性。這段時間特別容易出現「如果失敗就完了」的壓力感。你會把很多事情看得很重，也可能因此忽略了身邊的人。命中的力量很強，但如果只剩下目的，就會慢慢失去感受生活的能力。你真正需要學的，不只是瞄準，而是接受：有些箭射出去後，未必會照著你預期的方向飛。',
    貴人:'命中的貴人通常是「幫你校準方向的人」。這個人可能很果斷、很清楚自己要什麼，也會逼你停止逃避。對方像弓箭手一樣，能看出你真正的天賦與弱點。有些人抽到命中貴人時，會遇到改變人生方向的導師型人物。這種人不一定溫柔，但他會讓你終於停止亂跑。因為有時候，人生最需要的，不是更多選擇，而是一個真正值得瞄準的目標。'},
  22:{name:'旋風',emoji:'🌪️',
    近況:'你最近的人生正在進入混亂加速期。很多事情同時發生、同時變動，你可能連喘口氣的時間都沒有。旋風出現時，通常代表命運正在強迫你離開舊秩序。你可能會突然搬家、換圈子、改變工作，或在人際與情緒上經歷劇烈波動。這段時間，你會有種「世界轉太快」的感覺。很多人抽到旋風時，人生都正站在大改變前夕，只是當下還看不懂這場混亂的真正意義。',
    挑戰:'旋風最大的挑戰，是失去重心。你最近可能被太多事情拉扯，導致情緒與判斷力開始混亂。這段時間特別容易衝動做決定，也容易因為壓力太大而突然崩潰。旋風的力量會把所有不穩的東西一起捲起來，包括你一直假裝沒事的情緒。真正危險的，不是變化，而是你在混亂中忘了自己是誰。你現在最需要的，不是立刻控制一切，而是找到那個不管風多大都不會倒下的核心。',
    貴人:'旋風的貴人通常是「能在混亂裡保持冷靜的人」。對方可能很理性、反應快，也很擅長處理危機。當所有人都慌掉時，他反而會變得更清楚。這種人像暴風眼，雖然身處混亂中心，卻依然穩定。你會發現，只要他出現，你原本亂成一團的思緒就會慢慢整理起來。旋風型貴人不是替你擋風，而是教你怎麼在風暴裡站穩。'},
  23:{name:'海豚',emoji:'🐬',
    近況:'你最近正在慢慢找回內心的柔軟。海豚出現時，通常代表你的人際與情緒開始重新流動。有些過去讓你封閉的東西，正在一點一點鬆開。你可能會突然想靠近人、想分享心情，或重新感受到生活裡那些小小快樂。這不是幼稚，而是靈魂終於願意浮出水面呼吸。海豚的能量很特別，它代表即使經歷很多黑暗，你內心深處仍然保留著相信世界的能力。',
    挑戰:'海豚最大的挑戰，是太容易心軟。你最近可能會因為同情、因為感情，而再次回到那些原本該離開的人事物裡。這段時間特別容易被情緒影響判斷，也容易因為害怕孤單而勉強自己。海豚的溫柔很珍貴，但如果沒有界線，就會變成自我消耗。你真正需要學的，不只是愛人，而是知道哪些人值得你靠近。因為不是所有微笑，都代表安全。',
    貴人:'海豚的貴人通常是「讓你重新快樂的人」。對方可能幽默、溫暖、情緒很自由，和他相處時，你會短暫忘記那些沉重的事。這種人不一定成熟世故，但他會讓你重新感受到活著的輕盈感。有些人抽到海豚貴人時，會遇到像救生圈一樣的存在。你原本快沉下去的時候，他剛好出現。因為真正的療癒，有時不是解決問題，而是讓你重新願意笑出來。'},
  24:{name:'鑰匙',emoji:'🔑',
    近況:'你最近的人生正在靠近某個「即將打開」的階段。很多事情其實已經走到門前，只差最後一個契機。鑰匙出現時，通常代表答案、機會或真相快要浮現。你可能會開始遇到關鍵資訊、關鍵人物，或突然理解某件困擾很久的事情。這段時間，你會有種命運正在悄悄轉動的感覺。某扇原本打不開的門，其實已經開始鬆動，而你現在需要的，是決定自己敢不敢推開它。',
    挑戰:'鑰匙最大的挑戰，是你可能還不敢真正開門。你最近也許一直在等待更安全、更確定的時機，但很多改變本來就伴隨未知。這段時間特別容易出現「答案就在眼前，卻遲遲不行動」的狀態。你可能害怕失敗，也害怕真的改變之後，人生再也回不去。鑰匙其實代表選擇權已經來到你手上。真正困住你的，未必是門鎖，而是你還不願意承認：自己其實早就可以離開原地。',
    貴人:'你的貴人是一個「替你打開世界的人」。他不一定最親近，甚至可能只是短暫出現，但會在某個關鍵時刻，給你一個改變方向的入口。這個人可能帶來一份機會、一句提醒、一個新環境，或單純讓你突然看見：原來人生還能這樣活。鑰匙貴人的力量，不是保護你，而是解除你原本的限制。當這種人出現時，通常代表你的人生即將進入新的房間，而很多原本以為走不出去的困局，也會在那之後開始鬆開。'},
  25:{name:'藍眼護身',emoji:'🧿',
    近況:'你最近的直覺正在變得異常敏銳。很多事情你還沒看到證據，心裡卻已經先感覺不對。藍眼護身出現時，通常代表你正被某種外界能量注視著，有些人對你抱著嫉妒、好奇，甚至說不出口的敵意。你可能開始變得不想社交、不想解釋，也更容易察覺別人的情緒變化。這不是你太敏感，而是你的防禦本能正在啟動。最近的你像戴著透明護罩，一邊保護自己，一邊觀察誰是真心靠近。',
    挑戰:'藍眼護身最大的挑戰，是你會開始過度防備。你最近可能很難真正放鬆，總覺得有人在觀察你、比較你，甚至暗中期待你失敗。這段時間特別容易進入「不敢相信任何人」的狀態。你可能把自己包得太緊，久了連善意也不敢接受。真正危險的，不一定是外界，而是你開始習慣孤立自己。因為當一個人長期處在警戒狀態，心會慢慢失去溫度。',
    貴人:'藍眼護身的貴人通常是「默默保護你的人」。對方可能低調、不愛張揚，但總能在你快出事前提醒你。他像一種隱形守護力量，不一定天天出現，卻會在關鍵時刻替你擋掉很多麻煩。有些人抽到藍眼護身貴人時，會遇到直覺很準的人。你甚至會懷疑，他是不是比你還了解你自己。這種人不是把你推向世界，而是先幫你避免被世界吞沒。'},
  26:{name:'法蒂瑪之手',emoji:'🪬',
    近況:'你最近正處在一段「命運保護期」。很多原本可能失控的事情，最後都莫名其妙被化解。法蒂瑪之手出現時，通常代表你其實已經避開了一些看不見的危險。你可能會突然取消某個行程、突然錯過某個機會，當下覺得可惜，後來卻發現那其實是保護。這個符號帶有很強的神秘感，像有某種力量正在替你擋災。最近的你，不能只相信表面結果，因為有些失去，其實是在救你。',
    挑戰:'法蒂瑪之手最大的挑戰，是你會過度依賴命運。你最近可能開始覺得「反正宇宙會安排」，於是忽略了自己該做的選擇。這段時間尤其容易陷入被動等待，期待事情自己變好。保護並不代表不用成長，有些課題還是得你親自面對。真正的危險，不是壞運，而是你把所有責任都交給未知。因為命運可以替你關上一扇門，但真正要不要往前走，還是得你自己決定。',
    貴人:'法蒂瑪之手的貴人通常是「有很強守護能量的人」。對方可能很溫暖、很有包容力，也可能帶著某種宗教感或靈性氣質。你會發現，只要他在身邊，你的焦慮就會下降。這種人像護身符一樣，會讓混亂慢慢穩定下來。有些人抽到這個符號時，會遇到總能在危險前出現的人。你後來才會明白，他不只是巧合，而是命運派來替你擋掉某些黑暗的存在。'},
  27:{name:'仙人掌',emoji:'🌵',
    近況:'你最近的人生正在進入「高防禦模式」。你可能變得不太愛說話、不太想依賴別人，也開始習慣把情緒藏起來。仙人掌出現時，通常代表你曾經在某段關係或經歷裡受過傷，所以現在的你開始長出刺。這不是冷漠，而是一種生存方式。你最近表面看起來沒事，但其實心裡早就乾裂很久。真正讓你疲憊的，不是孤單，而是你已經太習慣一個人硬撐。',
    挑戰:'仙人掌最大的挑戰，是你會拒絕所有靠近。你最近可能覺得「反正最後都會失望」，於是乾脆先保持距離。這段時間特別容易嘴硬、逞強，明明很需要陪伴，卻又不願意承認。仙人掌的刺能保護你，也會讓真正想靠近的人退縮。你真正需要學會的，不是把自己變得更堅強，而是重新相信：有人靠近你，不一定是為了傷害你。',
    貴人:'仙人掌的貴人通常是「不怕你冷淡的人」。對方可能很有耐心，也很懂得尊重距離。他不會強行闖進你的世界，而是慢慢等你願意打開。這種人像沙漠裡的水源，不會突然出現戲劇化救援，卻能長久支撐你。有些人抽到仙人掌貴人時，會遇到一個願意理解自己沉默的人。你會發現，真正溫柔的人，不會逼你立刻卸下防備。'},
  28:{name:'高山',emoji:'🏔️',
    近況:'你最近正站在人生某個很高的位置前方。高山出現時，通常代表你正在面對巨大目標、壓力或責任。你可能感覺事情進展很慢，但其實你已經走到別人到不了的高度。這段時間，你會開始變得孤獨，因為不是每個人都理解你的選擇。很多人看到的是你的堅強，只有你知道自己其實已經快喘不過氣。高山不是停滯，而是命運正在考驗你到底能不能翻越下一個階段。',
    挑戰:'高山最大的挑戰，是過程太漫長。你最近可能開始懷疑：自己到底還要撐多久？這段時間特別容易因為疲憊而想放棄。你會發現，有些目標不是努力一下就能得到，而是要長時間孤獨前進。高山也代表壓力與高度，站得越高，越容易感覺寒冷。真正危險的，不是失敗，而是你在途中忘了為什麼出發。因為很多人不是輸給困難，而是輸給長期看不到終點。',
    貴人:'高山的貴人通常是「已經翻過山的人」。對方可能成熟、沉穩，甚至經歷過比你更辛苦的人生。他不一定會安慰你，但會讓你知道：這段路其實走得過去。這種人像登山嚮導，知道哪裡危險，也知道哪裡該停下休息。有些人抽到高山貴人時，會遇到一個讓自己突然穩定下來的人。因為真正厲害的貴人，不是替你爬山，而是讓你不再害怕山有多高。'},
  29:{name:'火山',emoji:'🌋',
    近況:'你最近壓抑了太多情緒。很多事情表面看起來平靜，但內心其實早就開始沸騰。火山出現時，通常代表有些情緒已經累積太久，快要藏不住了。你可能一直忍耐、一直配合、一直假裝沒事，可真正的你其實非常疲憊。最近的你像沉睡火山，看起來安靜，底下卻充滿高溫熔岩。命運現在正在逼你面對那些長期被忽略的憤怒、委屈與慾望。',
    挑戰:'火山最大的挑戰，是情緒爆炸。你最近可能會突然失控、突然翻臉，甚至因為一件小事就全面崩潰。這段時間尤其要小心長期壓抑後的反撲。你可能以為自己很能忍，但真正危險的，從來都不是情緒本身，而是壓太久。火山的能量一旦爆開，很容易傷到自己也傷到別人。你現在真正需要的，不是繼續忍，而是找到安全釋放的方法。因為再堅硬的山，也有承受極限。',
    貴人:'火山的貴人通常是「能承接你真實情緒的人」。對方可能很穩、很有包容力，不會因為你的黑暗面而逃跑。這種人很少見，因為大部分的人只喜歡平靜版本的你。你會發現，在他面前，你終於不用假裝冷靜。火山型貴人像避風港，他不會叫你壓下情緒，而是讓你安全地爆發。因為真正的療癒，不是控制火，而是終於有人願意陪你穿過火。'},
  30:{name:'雄鷹',emoji:'🦅',
    近況:'你最近正在進入「視野提升期」。很多過去讓你糾結的事情，現在開始變得渺小。雄鷹出現時，通常代表你的靈魂正在往更高的地方飛。你可能開始脫離原本的圈子、重新思考未來，甚至突然不想再浪費時間在低層次消耗裡。這段時間，你的觀察力會變強，也會開始看清很多人真正的樣子。命運正在把你往更高的位置推，而高度改變之後，你看世界的方式也會完全不同。',
    挑戰:'雄鷹最大的挑戰，是孤高感。你最近可能會開始覺得沒有人懂你，甚至慢慢與周圍的人產生距離。這段時間特別容易出現「我只能靠自己」的想法。你會變得更理性、更獨立，但也可能因此失去情感連結。飛太高的人，很容易忘記怎麼落地。真正危險的，不是成長，而是你開始看不起那些還停在原地的人。因為高度如果沒有溫度，最後只會剩下孤單。',
    貴人:'雄鷹的貴人通常是「帶你看見更大世界的人」。對方可能很有遠見、行動力強，也不會被小事困住。他像天空裡的領航者，會讓你意識到自己其實能飛得更遠。有些人抽到雄鷹貴人時，會遇到徹底改變眼界的人。你原本以為人生只能這樣，但他會讓你第一次看見更高的可能性。真正強大的貴人，不是替你飛，而是提醒你其實也有翅膀。'},
  31:{name:'狼',emoji:'🐺',
    近況:'你最近正在進入一段「本能甦醒期」。很多壓抑很久的情緒與慾望，開始慢慢浮上來。狼出現時，通常代表你不想再當乖的人了。你可能開始變得直接、敏感，也開始不願再忍受虛假的關係。這段時間，你會特別重視忠誠與界線。那些曾經讓你受傷的人，現在只要一靠近，你的直覺就會立刻警覺。最近的你像夜裡的狼，沉默、警戒，但眼神已經和以前不同。',
    挑戰:'狼最大的挑戰，是太容易進入對立模式。你最近可能會對人失去耐心，也容易因為被冒犯而瞬間翻臉。這段時間特別容易出現「不是自己人，就是敵人」的極端感。狼的能量很真實，但也容易孤立自己。你可能開始只相信少數人，甚至拒絕新的關係靠近。真正危險的，不是防備，而是你開始忘記：不是每個人都會背叛你。',
    貴人:'狼的貴人通常是「願意和你並肩的人」。對方不一定溫柔，但非常講義氣。他可能沉默、不愛說廢話，可一旦認定你，就會站在你這邊。這種人像狼群成員，不會隨便靠近誰，但會在危險時一起撐住。有些人抽到狼型貴人時，會遇到真正能互相信任的人。你會發現，原來不用一直獨自戰鬥，也能活下去。'},
  32:{name:'麋鹿',emoji:'🦌',
    近況:'你最近的能量正在變得柔軟。麋鹿出現時，通常代表你開始想遠離衝突、遠離混亂，只想安靜地活著。你可能會突然對自然、平靜、單純的東西產生依戀，也開始厭倦那些充滿算計的人際。這段時間，你的心其實很敏感，只是不想再被世界刺傷。麋鹿象徵的是溫柔與純淨，它通常出現在靈魂很累、卻仍然不願變壞的人身上。',
    挑戰:'麋鹿最大的挑戰，是太容易受傷。你最近可能會因為一句話、一個眼神，就默默難過很久。這段時間特別容易逃避衝突，也容易因為不想麻煩別人而壓抑自己。你的善良是真實的，但如果沒有界線，就會變成別人消耗你的理由。真正需要學會的，不是變冷酷，而是知道：溫柔不代表必須委屈自己。',
    貴人:'麋鹿的貴人通常是「讓你感到安心的人」。對方可能溫和、穩定，不會帶給你壓迫感。和他相處時，你不需要時刻警戒，也不用擔心被利用。這種人像森林裡安靜的光，雖然不耀眼，卻能慢慢修復你的疲憊。有些人抽到麋鹿貴人時，會遇到讓自己終於願意卸下防備的人。因為真正珍貴的關係，不是刺激，而是安心。'},
  33:{name:'蛇',emoji:'🐍',
    近況:'你最近正在進入一段「直覺比證據更早出現」的時期。很多事情表面正常，但你其實早就感覺到哪裡不對。蛇這個符號通常會出現在人際開始重新洗牌之前。有人靠近你時會帶著某種隱藏目的，也可能是你開始發現某些關係只是利益交換。你最近會突然對某句話特別敏感，甚至在深夜反覆回想。這不是多疑，而是你的潛意識正在提前警告。蛇並不代表災難，而是提醒你：真正危險的從來不是敵人，而是披著熟悉外皮的人。',
    挑戰:'你最大的挑戰，是過度壓抑自己的警覺。你最近其實已經察覺某件事情正在失控，但你一直試圖合理化對方、合理化現況，甚至懷疑是不是自己想太多。蛇象徵的是「不能忽視的異樣感」。有些關係表面還能維持聊天與互動，但信任早就裂開。你現在很容易因為害怕衝突，而讓自己停留在有毒環境。更麻煩的是，你可能正在對某個人心軟，而對方卻早已開始計算你。這段時間你需要學會：不是每個靠近你的人，都值得再次相信。',
    貴人:'你的貴人是一個極度敏銳的人。他不一定溫柔，甚至有點冷，但他能瞬間看穿局勢。他可能會直接拆穿你一直不願承認的真相，讓你當下不舒服，卻因此避開更大的損失。這個人很像蛇本身——安靜、觀察力強、不愛浪費話語。他會在別人都看不出問題時提醒你：「這件事不單純。」近期如果有人突然勸你離開某段關係、某份合作、某個圈子，不要急著反感。那可能就是命運派來替你擋災的人。'},
  34:{name:'天蠍',emoji:'🦂',
    近況:'你最近的情緒像深海一樣安靜，但底下其實藏著劇烈暗流。很多人以為你沒事，因為你依然正常說話、正常生活，但只有你知道，有些情緒正在慢慢累積。天蠍這個符號出現時，通常代表「某種隱藏的真相快浮出來了」。可能是感情、友情、金錢，或某個你一直不敢面對的答案。你最近對背叛特別敏感，也會突然開始回頭檢查過去發生的細節。命運正在逼你看清：有些事情不是突然變質，而是早就開始腐爛。',
    挑戰:'你的挑戰，是過度沉浸在情緒深處。你現在很容易陷入一種「越想越停不下來」的狀態，表面安靜，內心卻像深夜裡不斷重播的監視畫面。天蠍最大的危險，不是爆炸，而是沉默。你可能正在等待別人主動坦白、主動改變、主動回頭，但對方其實早已習慣你的忍耐。這段時間最危險的不是敵人，而是你自己開始習慣受傷。當你明知道不對，卻還繼續停留，那些情緒最後會反過來吞噬你。',
    貴人:'你的貴人是一個曾經經歷過巨大背叛的人。他身上有種很重的故事感，看起來冷冷的，但其實比任何人都懂你的情緒。他不會安慰你「沒事」，反而會直接告訴你：「你現在其實已經知道答案了。」這個人會幫你從情緒泥沼裡抽離，逼你重新掌控人生。近期如果有人開始教你保護界線、切割消耗、停止討好，那不是巧合。天蠍貴人的出現，通常代表你的人生即將進入一次徹底重生。'},
  35:{name:'蜘蛛',emoji:'🕷️',
    近況:'你最近像被困在一張看不見的網裡。很多事情不是不能動，而是你一動，整個局勢就會一起震動。蜘蛛象徵「慢慢編織中的命運」。你可能正在某段複雜關係、工作局勢、社交圈裡感到窒息，但又無法立刻抽身。更奇怪的是，你最近會發現很多巧合開始重複出現：同一句話、同一種人、同樣的情境。這代表命運正在提醒你——有個循環還沒真正結束。蜘蛛出現時，通常意味著：你已經被某件事纏住很久了。',
    挑戰:'你的挑戰，是被情緒與關係慢慢消耗。蜘蛛網最可怕的地方，不是瞬間困住，而是讓人不知不覺失去力氣。你最近可能一直在替別人收尾、承接情緒、維持表面和平，久了連自己真正想要什麼都快忘了。你也容易陷入過度觀察別人的狀態，開始猜測每句話背後的含義。這段時間你需要小心：有些人其實正在利用你的心軟與責任感，把你留在一個對他有利的位置。再不抽離，你會越來越不像自己。',
    貴人:'你的貴人是一個非常會布局的人。他不一定高調，但總能在混亂裡找到出口。這個人可能擅長分析、人際觀察、資源整合，甚至有點操盤手的感覺。他會讓你第一次看見：「原來事情還有另一種解法。」近期如果有人突然開始幫你整理局勢、拆解問題、提醒你哪些人不可信，那很可能就是蜘蛛型貴人。他不會直接替你戰鬥，但會給你一張新的地圖，讓你知道怎麼離開這張困住你很久的網。'},
  36:{name:'櫻花',emoji:'🌸',
    近況:'你最近正處於一段「短暫卻極美」的人生片段。很多事情看起來浪漫、溫柔、充滿希望，但你內心其實隱約知道，它不會永遠停留。櫻花這個符號常出現在感情升溫、關係曖昧、人生突然變得柔軟的時期。你最近可能特別容易被某些瞬間打動：一個眼神、一句話、一場深夜聊天。但櫻花真正的訊息不是幸福，而是「所有美好的東西都有期限」。命運正在提醒你：別只顧著害怕失去，而忘了真正去感受。',
    挑戰:'你的挑戰，是太害怕結束。你最近其實已經察覺，有些人、有些關係、有些快樂，正在慢慢靠近期限。但你越想抓住，反而越容易失控。櫻花象徵「無法永久保存的美」。你可能會開始過度在意對方的反應、訊息頻率、態度變化，甚至因為害怕失去而變得不像自己。這段時間你要學會一件很難的事：真正重要的，不是讓所有東西永遠留下，而是你有沒有真實活過那段瞬間。',
    貴人:'你的貴人是一個讓你重新感受到溫柔的人。他可能不像煙火那麼強烈，但和他待在一起時，你會突然覺得世界沒那麼刺。這個人不一定會長久停留，可他會在你最疲憊的時候，提醒你「原來自己還能被好好對待」。近期如果有人開始讓你重新喜歡生活、重新期待見面、重新想打開心，那就是櫻花型貴人。他的出現不是為了改變命運，而是為了讓你在崩裂之前，再次想起心動的感覺。'},
  37:{name:'向日葵',emoji:'🌻',
    近況:'你最近像一株被迫朝向光源生長的向日葵。表面上看起來還撐得住，甚至比平常更開朗，但其實內心早就進入某種疲憊循環。你正在拼命尋找能讓自己繼續發亮的人、工作、關係或理由。這個符號通常會出現在「正在失去熱情，但還沒承認的人」身上。有些事你不是不知道結果，而是你還捨不得離開那道曾經照亮過你的光。',

  38:{name:'玫瑰',emoji:'🌹',

    挑戰:'你的挑戰來自「太渴望被珍惜」。你開始為了維持某種關係，慢慢修改自己的樣子，甚至壓抑真正的情緒。最近有些話你沒有說出口，不是因為不在意，而是害怕一旦說破，現在的平衡就會崩塌。玫瑰最危險的地方，從來不是刺，而是讓人甘願流血。你必須分清楚，現在讓你心動的，到底是真愛，還是被需要的幻覺。',

    挑戰:'你的挑戰是放不下某個已經過季的東西。那可能是一段關係、一個身份、一個曾經很耀眼的自己。你其實知道它正在枯萎，卻還是不願承認。最近有種情緒會反覆出現——你看著別人往前走，自己卻像停在秋天裡。楓葉最危險的地方，是太美的結束容易讓人誤以為還有重來的可能。但有些故事，本來就是用來告別的。',
    貴人:'你的貴人是一個經歷過巨大轉變的人。他可能離過職、搬過城市、失去過重要關係，但也因此比誰都懂「重新開始」的力量。他會讓你知道，人生不是只有盛夏才算成功。這個人帶著很深的秋天能量，安靜卻真實。當你開始與他接觸，你會慢慢發現：原來真正成熟的人，不是從不失去，而是學會在變化中繼續往前。'},
  40:{name:'綠草',emoji:'🌿',

    挑戰:'你的挑戰是太容易忽略自己的成長。因為變化不夠劇烈，你會誤以為自己停滯不前。你總是在等一個巨大的轉折，卻看不到那些每天一點點恢復的痕跡。最近有個問題正在悄悄影響你——你太常拿自己跟別人的人生比較。草地不會因為花開得更耀眼就停止生長，但你卻一直懷疑自己的價值。',
    貴人:'你的貴人是一個「很日常的人」。他可能沒有驚人的氣場，也不會突然改變你的人生，但他會在你最疲憊的時候，默默把你拉回正常世界。這個人身上有很強的大地能量，穩定、耐心、不戲劇化。你跟他相處時，情緒會自然安靜下來。真正能救你的人，未必是煙火般的人物，有時候只是那個願意陪你慢慢活下去的人。'},
  41:{name:'珊瑚',emoji:'🪸',

  42:{name:'葉子',emoji:'🍃',

  43:{name:'稻穗',emoji:'🌾',
    近況:'你最近正在進入「準備收成」的階段。有些事情其實已經默默累積很久了，只是你一直沒有發現成果正在靠近。稻穗象徵長時間的沉默耕耘。你最近可能會開始感覺到：某些努力終於有人看見、某些能力終於被需要。雖然現在還沒完全結果，但命運其實已經開始鬆動。這段時間很適合重新檢查自己的價值。你不是沒有成長，而是過去一直把自己放在太貧瘠的位置。',

  44:{name:'岩石',emoji:'🪨',

  45:{name:'泡泡',emoji:'🫧',

    挑戰:'你的挑戰是逃避真相。你太害怕泡泡破掉後的空白感，所以寧願待在一個不真實但舒服的世界裡。最近有件事已經開始出現裂痕，只是你還不願正面面對。這個符號也代表「短暫快樂的代價」。如果你繼續忽略現實，之後的失落感會比現在更重。不是所有看起來浪漫的東西，都真的能陪你走到最後。',

  46:{name:'冰晶',emoji:'❄️',

  47:{name:'大馬戲',emoji:'🎪',

    貴人:'你的貴人是一個能看穿你表演的人。他不會只被你的外表吸引，而是會注意到你那些疲憊的小細節。這個人可能很安靜，甚至在人群裡不太起眼，但他會讓你第一次覺得：原來不用逞強，也有人願意留下。當他出現時，你會開始慢慢放下那些過度誇張的情緒表演，重新學會真正的放鬆。'},
  48:{name:'旋轉木馬',emoji:'🎠',
    近況:'你最近的人生正在進入某種「看似前進，實際原地打轉」的循環。每天都有事情發生，也一直很忙，但真正重要的問題始終沒有被解決。這個符號通常出現在陷入重複模式的人身上。你可能反覆愛上類似的人、進入類似的關係，或者總是在同樣的情緒裡繞圈。你開始隱約感覺到：有些故事好像一直在重演。',

  49:{name:'摩天輪',emoji:'🎡',

    挑戰:'你的挑戰是過度逞強。你很習慣把難受變成玩笑，把失落變成一句「沒差啦」。但最近有些事情已經開始超過你能獨自消化的範圍。橘子的酸味代表內心仍有沒說出口的委屈，如果長期壓抑，會慢慢變成對世界的疲憊感。你現在最需要的，不是表現堅強，而是承認自己其實已經累了。',
    貴人:'你的貴人是一個很會察覺細節的人。他可能不是最熱情的類型，但會默默記得你的情緒變化。當所有人都只看見你的表面時，只有他發現你笑容背後的不對勁。橘子貴人的出現，代表你即將遇到一個能讓你卸下偽裝的人。你不用在他面前演得很正常，因為他看得懂那些你沒說出口的疲憊。'},
  94:{name:'檸檬',emoji:'🍋',

    挑戰:'你的挑戰是過度反應。檸檬的酸味象徵情緒刺激過強，你最近很容易因為小事陷入情緒循環，尤其在人際關係裡，會反覆猜測別人的態度。有些事情其實沒有那麼嚴重，但你的內心已經處於長期緊繃狀態，所以任何風吹草動都會被放大。這段時間，你最需要學會的是停止腦內重播。',
    貴人:'你的貴人是一個能讓空氣變輕的人。他可能幽默、隨性，甚至有點不按牌理出牌，但只要跟他待在一起，你就會短暫忘記那些反覆折磨你的情緒。檸檬貴人的力量不是解答，而是中斷你的焦慮循環。他會提醒你：人生有時候不用想那麼深，很多答案其實沒有你想像中那麼可怕。'},
  95:{name:'葡萄',emoji:'🍇',

    挑戰:'你的挑戰是太在意群體中的位置。你最近可能一直在觀察別人的反應，擔心自己是不是被忽略、被替代、或不再重要。葡萄象徵一串彼此相連的情緒，因此你很容易被他人的態度影響。這段時間最危險的不是孤單，而是為了維持連結，開始失去真正的自己。',
    貴人:'你的貴人不是最耀眼的人，而是那個始終沒離開的人。當很多關係都變得複雜時，他仍然保持穩定。葡萄貴人通常很低調，但他會在你最混亂的時候提醒你：真正重要的關係，不需要靠討好維持。這個人的存在，會讓你慢慢看清誰只是熱鬧，誰才是真正能陪你走下去的人。'},
  96:{name:'草莓',emoji:'🍓',

    挑戰:'你的挑戰是過度理想化。你最近容易把某段關係想得太美，甚至忽略裡面早就存在的不平衡。草莓象徵「容易腐壞的甜」，代表有些情緒雖然美好，卻未必能長久。你現在需要分清楚：你是真的愛這個人，還是只是太想再次感受到被愛的感覺。',
    貴人:'你的貴人是一個情感很細膩的人。他可能不擅長大道理，但總能在你情緒低落時出現。草莓貴人的能量很像冬天裡的一杯熱飲，未必轟轟烈烈，卻會慢慢融化你長期壓抑的情緒。他會讓你知道，真正的陪伴不是激情，而是在你脆弱時仍願意留下來。'},
  97:{name:'藍莓',emoji:'🫐',

    挑戰:'你的挑戰是把情緒藏得太深。藍莓的深色象徵壓抑與沉默，你最近可能習慣自己消化一切，不想麻煩別人。但長期下來，那些沒說出口的情緒會慢慢變成孤獨感。你越假裝沒事，別人越看不見你的疲憊。這段時間最危險的不是受傷，而是你開始覺得「反正也沒人懂」。',
    貴人:'你的貴人是一個很會傾聽的人。他不一定話多，但有種奇怪的能力，能讓你不知不覺把真正的情緒說出來。藍莓貴人像深夜裡一盞不刺眼的燈，不會逼你振作，只會靜靜陪你把那些混亂慢慢整理清楚。他的出現，代表你終於不用再獨自消化所有事情。'},
  98:{name:'奇異果',emoji:'🥝',
    近況:'奇異果代表「外硬內軟」的狀態。你最近可能看起來比以前更冷靜、更理性，但其實內心非常敏感。很多事情你不是不在意，而是開始學會先保護自己。這顆符號帶著一種防禦性的成熟感，你正在慢慢改變與世界互動的方式。曾經讓你受傷的經驗，如今已經變成你新的外殼。',
    挑戰:'你的挑戰是不願再相信別人。奇異果象徵保護層，你最近可能對很多靠近你的人保持距離，甚至下意識先懷疑對方。你害怕再次失望，所以寧願提前關上門。但問題是，當你一直處於防備狀態時，也會錯過真正想靠近你的人。這段時間，你需要重新學習「適度相信」。',
    貴人:'你的貴人是一個很有耐心的人。他不會急著闖進你的世界，而是慢慢等你願意打開心房。奇異果貴人的特別之處，在於他不會因為你的冷淡就離開。當別人只看到你的刺時，他卻願意理解你為什麼會變成現在這樣。這種人會讓你重新相信：不是所有靠近都帶著傷害。'},
  99:{name:'水蜜桃',emoji:'🍑',

    挑戰:'你的挑戰是過度依賴他人的反應。水蜜桃的人很容易因為一句冷淡的回覆、一點距離感，就開始懷疑自己是不是不夠好。你最近可能一直在等待某個人的訊號，甚至讓自己的情緒跟著對方起伏。這顆符號提醒你：真正的價值感，不該建立在別人的態度上。',
    貴人:'你的貴人是一個很真誠的人。他不會用曖昧試探你，也不會故意忽冷忽熱。當你開始懷疑自己的時候，他會用非常直接的方式讓你知道：你其實比自己想像中更有魅力。水蜜桃貴人的出現，通常代表你會慢慢離開那種一直討好別人的狀態。'},
  100:{name:'芒果',emoji:'🥭',
    近況:'芒果代表一種濃烈而悶熱的命運能量。你最近的生活不像暴風雨，而比較像雨季前的空氣，黏稠、混亂、讓人喘不過氣。很多事情正在發酵，尤其是感情、慾望與壓抑很久的情緒。你可能開始強烈想逃離現在的狀態，或突然渴望某種更自由、更熱烈的人生。這個符號通常出現在「內心已經快壓不住真正慾望」的人身上。',
    挑戰:'你的挑戰是沉迷於情緒高峰。芒果的甜味象徵誘惑，你最近容易被短暫快感吸引，不管是關係、幻想還是衝動決定，都可能讓你忽略後續代價。尤其當你感到空虛時，很容易想用新的刺激填補自己。這段時間最危險的，不是做錯選擇，而是你開始依賴那些讓你短暫忘記現實的東西。',

  101:{name:'鳳梨',emoji:'🍍',
    近況:'鳳梨象徵「外硬內甜」的生存狀態。你最近可能變得比以前更有防備感，很多事情不再輕易相信，也不再隨便對別人敞開自己。表面上你像沒事一樣繼續前進，但其實心裡有些地方已經悄悄受過傷。這個符號代表你正在學習保護自己的情緒，同時也開始重新定義：誰才真正值得靠近。',
    挑戰:'你的挑戰是太習慣逞強。鳳梨的人常常把疲憊藏得很好，甚至連自己都忘記其實已經撐太久。最近你可能有種感覺：明明很多事情都處理好了，卻還是開心不起來。那是因為你一直在消耗自己去維持穩定。這段時間，你需要的不是再努力一點，而是允許自己偶爾脆弱。',
    貴人:'你的貴人是一個很真實的人。他不會過度包裝自己，也不會對你說漂亮話，但他會讓你慢慢放下戒心。鳳梨貴人的特別之處，在於他能看穿你表面的堅強。他會提醒你：真正成熟的人，不是永遠不倒下，而是知道什麼時候該停下來休息。這種人會讓你重新感受到安全感。'},
  102:{name:'椰子',emoji:'🥥',

    挑戰:'你的挑戰是過度封閉。你最近可能開始習慣自己消化所有事，不再期待別人的陪伴。久了之後，那種獨立感會慢慢變成疏離感。椰子的訊號提醒你：不是所有靠近都會傷害你。有些人其實正在試著理解你，只是你太早把門關上了。這段時間，你最需要學會的是重新建立連結。',
    貴人:'你的貴人是一個讓人安心的人。他不會突然闖進你的世界，而是像海浪一樣慢慢靠近。椰子貴人的能量很溫和，他不會逼你說出情緒，但會讓你知道：你其實不用一直一個人撐著。當這種人出現時，代表你的孤獨感即將開始鬆動，某些封閉很久的情緒，也會慢慢重新流動。'},
  103:{name:'櫻桃',emoji:'🍒',

    挑戰:'你的挑戰是沉迷於短暫情感。櫻桃象徵容易上癮的甜味，你最近可能一直反覆回頭看某段關係，或不斷期待某個人重新出現。問題是，你懷念的未必是真正的對方，而是那段曾經被需要、被喜歡的感覺。這顆符號提醒你：有些東西之所以美，是因為它本來就不會長久。',

  104:{name:'水滴',emoji:'💧',

  105:{name:'紅圓',emoji:'🔴',

    挑戰:'紅圓的挑戰不是衝動，而是失控。你可能正在把某種焦躁感投射到別人身上，尤其在人際與感情裡，會突然對一句話過度敏感。最近容易出現「明明沒那麼嚴重，卻瞬間爆炸」的情況。這個符號也暗示，你內心有件事其實已經忍太久，再不處理，情緒會像封閉空間裡的火種一樣悶燒。',
    貴人:'你的貴人是一個氣場很強的人。他可能講話直接、不太安慰人，但總能逼你看見真正問題。這種人不一定溫柔，甚至第一次接觸時會讓你有壓力，可他會推著你離開原本停滯的狀態。紅圓貴人的出現，通常代表你的人生接下來不會再慢慢來，而是會被迫進入新的速度。'},
  106:{name:'橘圓',emoji:'🟠',
    近況:'你最近的命運帶著一種「快要發生什麼」的氣味。生活表面看似正常，但其實很多東西正在醞釀。橘圓像夕陽落下前最後一層光，代表轉換期、搬移感、曖昧中的不安與期待。你可能開始對原本穩定的日常失去耐心，甚至有種直覺：如果再不改變，自己會慢慢被困在現在的版本裡。',
    挑戰:'你的挑戰來自猶豫。橘圓的人容易卡在「好像可以、又好像不行」的狀態，拖延真正重要的決定。最近尤其容易反覆查看訊息、重想過去對話，或在心裡模擬不同結局。這顆符號提醒你，有些門不是等準備好才會打開，而是推開之後，你才會知道自己早就站在入口很久了。',

  107:{name:'黃圓',emoji:'🟡',
    近況:'黃圓代表你的精神正在甦醒。你最近可能突然對某件事重新燃起興趣，或者開始意識到，自己其實已經很久沒有真正快樂。這不是單純的好運，而是一種「靈魂開始恢復亮度」的訊號。你會發現某些巧合變多、某些人突然出現、某些卡住很久的事情開始流動，好像世界正在偷偷回應你。',
    挑戰:'你的問題在於過度消耗自己的能量。你最近可能一直在照亮別人，卻忘了自己也需要休息。黃圓的人很容易把責任背在身上，久了之後，就會開始出現疲憊、空轉、甚至莫名厭世的感覺。這個符號提醒你：不是每一個黑暗的人都需要你去拯救，有時候，你得先保住自己的光。',

  108:{name:'綠圓',emoji:'🟢',
    近況:'綠圓代表修復。你最近的人生像一片被雨水慢慢滲透的土地，有些曾經乾裂的情緒開始恢復柔軟。你可能正在重新建立某段關係、重新整理生活，或重新認識自己真正想要的東西。這不是爆炸性的改變，而是一種安靜卻真實的重生。很多答案其實已經慢慢浮現，只是你還沒完全承認。',
    挑戰:'你的挑戰是停留在舒適區太久。綠圓的人容易因為害怕失控，而把自己困在安全但無趣的循環裡。最近可能會有一種感覺：生活沒有真的不好，但也沒有真正活著。這顆符號提醒你，有些成長會伴隨混亂，如果你一直只選擇穩定，命運就很難帶你走向新的地方。',
    貴人:'你的貴人是一個情緒很穩的人。他不會強行改變你，也不會逼你立刻振作，但他會像樹一樣安靜存在。當別人都急著給答案時，只有他願意聽你真正的情緒。綠圓貴人的出現，通常代表你接下來會慢慢離開內耗期，開始建立一種更健康、更長久的人生節奏。'},
  109:{name:'藍圓',emoji:'🔵',
    近況:'藍圓代表一段正在與自己對話的時期。你最近的情緒變得很深，很多事情開始不想解釋，也不再急著證明自己。外表看起來平靜，但其實內心一直在反覆思考某件重要的事。這顆符號像深海裡的光，安靜卻充滿壓力。你可能開始意識到，真正困住你的不是別人，而是你一直不願面對的內心聲音。',
    挑戰:'你的挑戰是過度沉溺思考。藍圓的人很容易陷進自己的世界，把每件事情反覆拆解。最近尤其容易在深夜突然清醒，腦中不停重播過去的對話與選擇。你以為自己是在找答案，但很多時候，其實只是困在情緒裡打轉。這段時間最危險的，不是失敗，而是你開始失去行動力。',
    貴人:'你的貴人是一個很冷靜的人。他不會情緒化安慰你，也不會陪你一起陷進低潮，而是會用非常穩定的方式把你拉回現實。藍圓貴人的力量像海上的燈塔，平常不特別顯眼，但在你快迷失方向時，會突然成為唯一能辨認的位置。他會幫助你重新整理混亂的內心。'},
  110:{name:'紫圓',emoji:'🟣',
    近況:'紫圓代表直覺與命運感正在變強。你最近可能一直反覆遇見某些巧合、夢境、重複訊號，甚至有種「事情好像早就註定」的感覺。這顆符號通常出現在人生轉折前夕。很多表面看似偶然的事情，其實正在把你慢慢推向新的方向。你最近的靈感與感知力會特別強，甚至比理性更早察覺答案。',
    挑戰:'你的挑戰是過度沉迷幻想。紫圓容易讓人把感覺當成現實，把想像中的結局投射到真正的人事物上。最近你可能一直在等待某個徵兆，或過度解讀別人的一句話、一個眼神。問題是，不是所有命運感都代表答案。有些只是你太渴望某件事，所以開始替世界加上意義。',
    貴人:'你的貴人是一個帶著神秘感的人。他可能不常出現，但每次出現，都會讓你重新思考人生方向。紫圓貴人像深夜裡突然亮起的紫色霓虹燈，危險、迷人，卻也帶著改變命運的力量。他會打開你原本不敢想的世界，讓你開始相信：人生其實還有另一種可能。'},
  111:{name:'黑圓',emoji:'⚫',
    近況:'黑圓代表終結與沉默。你最近可能正經歷某種情緒上的抽離感，對很多事情突然失去熱情，也不想再維持表面的熱鬧。這不是單純低潮，而像一段舊人生正在慢慢關燈。你可能開始遠離某些人、刪掉某些執念，甚至重新懷疑自己真正想要的是什麼。黑圓通常出現在「靈魂準備重啟」的人身上。',
    挑戰:'你的挑戰是把自己困進黑暗裡。黑圓的人很容易在受傷後選擇封閉，甚至開始覺得「反正沒人懂」。最近你可能一直避免與人真正交流，把情緒藏到很深的地方。問題是，當你長期待在黑暗裡，就會慢慢忘記自己其實還有被愛與被理解的能力。這段時間，你需要的是重新接觸世界。',
    貴人:'你的貴人是一個經歷過低谷的人。他不會對你說空泛的安慰，因為他知道真正的黑暗是什麼感覺。黑圓貴人的力量來自理解，他不會逼你立刻振作，只會陪你慢慢走出來。這種人的出現，通常代表你的生命即將結束某段長期的內耗期，開始進入新的循環。'},
  112:{name:'白圓',emoji:'⚪',
    近況:'白圓代表空白與重生。你最近可能有種奇怪的感覺：很多事情好像結束了，但新的東西又還沒真正開始。這是一段介於過去與未來之間的空窗期。你會開始重新整理生活、重新定義關係，甚至重新認識自己。白圓不像爆炸性的改變，而更像雪落下後的世界，看似安靜，卻已經完全不同。',
    挑戰:'你的挑戰是害怕空白。你最近可能一直想用忙碌、社交或新的目標填滿自己，不想面對那種「不知道下一步在哪裡」的感覺。但白圓真正的意義，就是讓舊的東西徹底退場。如果你一直急著填補空缺，就很難真正看見新的方向。這段時間，你需要學會與未知共處。',
    貴人:'你的貴人是一個很純粹的人。他可能話不多，也不特別張揚，但跟他相處時，你會感覺世界突然安靜下來。白圓貴人的能量像雪後的清晨，不會強行改變你，卻能讓你重新感受到平靜。這種人的出現，通常代表你的人生即將結束混亂，進入一個全新的階段。'},
  113:{name:'棕圓',emoji:'🟤',
    近況:'你最近進入了一種「回到土地」的狀態。不是往上衝，而是開始慢慢檢查自己的根到底穩不穩。很多人以為你沒野心，但其實你只是突然對那些浮誇的成功感到疲倦。你開始在意睡眠、吃飯、固定的陪伴，甚至想逃離太吵的人群。這個符號通常會出現在靈魂過度消耗之後。你正在從一個被世界拉扯的人，慢慢變回真正活著的人。有些東西正在沉澱，而真正的力量，也通常藏在最不起眼的土色裡。',
    挑戰:'棕圓最大的問題，是太容易困在「安全感依賴」。你最近可能明知道某段關係、某份工作、某種習慣已經讓你窒息，卻還是遲遲不敢離開。因為你害怕變動，也害怕重新開始。你把穩定看得太重，久了甚至會忘記自己曾經想成為什麼樣的人。這段時間最危險的不是失敗，而是你開始接受一種沒有靈魂的安穩。很多人以為人生崩塌是大地震，但有時候真正可怕的，是一點一點被磨平。',
    貴人:'你的貴人不是會把你推上舞台的人，而是能讓你安心坐下來吃頓飯的人。這個人可能很普通，不高調，不愛講大道理，但你跟他相處時，身體會自然放鬆。你最近真正需要的，不是刺激，而是一個能讓你恢復生命感的人。他會提醒你，人生不是只有競爭和速度。有些陪伴像木頭的味道，看起來平凡，卻能在最冷的時候替你擋風。這種貴人通常會在你最疲憊時出現。'},
  114:{name:'橘菱',emoji:'🔶',
    近況:'你最近的人生像一顆被拋進空中的訊號彈。很多事情正在快速聚焦，某些人突然開始注意你，某些機會也像巧合一樣同時出現。橘菱不是安靜的能量，它代表一種帶著侵略感的存在感。你會發現自己越來越不適合躲在人群後面。即使你不想被看見，命運也會慢慢把你推向聚光處。這段時間很容易發生「突然被點名」的事件。宇宙正在逼你承認：你已經不是過去那個不起眼的人了。',
    挑戰:'橘菱最危險的地方，是過度追求刺激。你最近可能開始沉迷於快速回應、即時快感、別人的注意力，甚至有點無法忍受平靜。一旦生活安靜下來，你就會焦躁，像房間突然斷電一樣空虛。這個符號常出現在情緒容易暴衝的人身上。你可能會做出太快的決定，或因為一時興奮，把真正重要的東西丟掉。現在的你很像高速行駛中的車，問題不是沒速度，而是你還不知道自己到底要去哪裡。',

  115:{name:'藍菱',emoji:'🔷',
    近況:'你最近像掉進深海訊號裡。外表看起來很平靜，但內心其實正在經歷某種巨大的重新整理。你開始對很多表面的東西失去興趣，包含社交、情緒表演、甚至過度熱鬧的關係。藍菱代表「精神頻率切換」，這通常會出現在一個人即將進入新階段之前。你會開始想獨處，想看天空，想半夜突然走出去吹風。有些答案不是別人給你的，而是你終於開始聽見自己真正的聲音。',
    挑戰:'藍菱最大的問題，是過度抽離。你最近可能開始變得很難被靠近，明明有情緒，卻選擇全部往內吞。久了之後，你會像漂浮在外太空的人，看得到世界，但感受不到溫度。這段時間要小心「理性偽裝」。你以為自己只是冷靜，其實是害怕再次受傷。有些人會突然覺得你變了，甚至開始看不懂你。真正的危險不是孤獨，而是你開始習慣不被理解，最後連自己都不願意開口。',

  116:{name:'暗月',emoji:'🌑',
    近況:'你最近正處在人生的「看不見期」。很多事情不像以前那麼明朗，甚至有種方向突然消失的感覺。暗月不是衰運，而是一種宇宙刻意把燈關掉的狀態。它會逼你停止依賴外界的聲音。你可能開始失眠、反覆回想某段關係，或突然懷疑自己現在走的路。這個符號常出現在重大轉折前。真正的改變不是煙火，而是那些沒有人看見、只有你自己知道的夜晚。你現在正在經歷那種夜晚。',

    貴人:'你的貴人可能也是個曾經走過黑夜的人。他不會用樂觀敷衍你，也不會一直叫你加油。相反地，他會安靜地陪你待在低潮裡。這種人身上有一種「看過世界真相後的溫柔」。你最近需要的不是被拯救，而是有人讓你知道：黑暗並不代表結束。有些人像月光，只在最暗的時候才看得見。這個貴人出現後，你會慢慢發現，原來自己不是孤單地掉進深夜裡。'},
  117:{name:'滿月',emoji:'🌕',

    挑戰:'滿月最大的問題，是情緒過載。你最近可能會因為太敏感，把別人的一句話、一個眼神放大成巨大的風暴。很多壓抑已久的東西正在浮出來，包括嫉妒、失落、依賴感，甚至是你不願承認的孤單。這段時間容易發生關係爆炸，因為你再也沒辦法假裝沒事。問題是，你現在的情緒像潮水一樣高，一旦失控，很容易把原本還能修補的東西直接沖毀。你需要學會先穩住自己。',

  118:{name:'風信子',emoji:'🪻',

seqs.forEach((seq,ri)=>{
  const tr=tracks[ri];
  [...seq,...seq].forEach(id=>{
    const d=document.createElement('div');
    d.className='card';
    const img=document.createElement('img');
    img.className='card-img';
    img.src=cardImg(id);
    img.alt='';
    img.draggable=false;
    d.appendChild(img);
    tr.appendChild(d);
  });
});

const loopPx=seqs.map(s=>s.length*CARD_H);
const pos=[0,0,0];
let lastTs=null;
let spinning=true;

function tick(ts){
  if(!spinning)return;
  if(lastTs===null)lastTs=ts;
  const dt=ts-lastTs;lastTs=ts;
  for(let ri=0;ri<3;ri++){
    pos[ri]+=dt*speeds[ri]*1.92;
    if(pos[ri]>=loopPx[ri])pos[ri]-=loopPx[ri];
    tracks[ri].style.transform=`translateY(-${pos[ri]}px)`;
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function getCenterIds(){
  const overlayH=699;
  const centerY=overlayH*0.41+77;
  return seqs.map((seq,ri)=>{
    const adjustedIdx=Math.floor((pos[ri]+centerY)/CARD_H)%seq.length;
    const safeIdx=((adjustedIdx%seq.length)+seq.length)%seq.length;
    return seq[safeIdx];
  });
}

// ══ Gacha ══
let currentIds=[1,2,3];

function doGacha(){
  if(!spinning)return;
  spinning=false;
  currentIds=getCenterIds();
  setTimeout(showPanel,700);
}

function showPanel(){
  const roleKeys=['近況','挑戰','貴人'];
  const roleLabel=['近況','挑戰','貴人'];

  const names=currentIds.map(id=>getData(id));
  document.getElementById('panel-names').textContent=
    names.map((d,i)=>`${roleLabel[i]} ${d.emoji}${d.name}`).join('  ✦  ');

  const row=document.getElementById('cards-row');
  row.innerHTML='';
  currentIds.forEach((id,i)=>{
    const d=getData(id);
    const card=document.createElement('div');
    card.className='result-card';
    const img=document.createElement('img');
    img.className='result-card-img';
    img.src=cardImg(id);img.alt=d.name;
    const lbl=document.createElement('div');
    lbl.className='result-card-label';
    lbl.textContent=roleLabel[i];
    const sub=document.createElement('div');
    sub.style.cssText='font-size:20px;color:#fff;font-weight:700;padding-bottom:10px;letter-spacing:1px;';
    sub.textContent=`${d.emoji} ${d.name}`;
    card.appendChild(img);card.appendChild(lbl);card.appendChild(sub);
    row.appendChild(card);
  });

  const area=document.getElementById('content-area');
  area.innerHTML='';
  currentIds.forEach((id,i)=>{
    const d=getData(id);
    const key=roleKeys[i];
    const block=document.createElement('div');
    block.className='reading-block';
    const isPlaceholder=d[key]==='###';
    block.innerHTML=`
      <div class="reading-who">${d.emoji} ${d.name} — ${key}</div>
      <div class="reading-text${isPlaceholder?' placeholder':''}">${d[key]}</div>
    `;
    area.appendChild(block);
    if(i<2){
      const hr=document.createElement('div');
      hr.style.cssText='height:1px;background:rgba(255,215,0,0.12);margin:22px 0;';
      area.appendChild(hr);
    }
  });
  area.scrollTop=0;

  document.getElementById('result-panel').classList.add('show');
  document.getElementById('overlay').classList.add('show');
}

function closePanel(){
  document.getElementById('result-panel').classList.remove('show');
  document.getElementById('overlay').classList.remove('show');
  spinning=true;lastTs=null;
  requestAnimationFrame(tick);
}

function againGacha(){
  switchMusic();
  closePanel();
}

// ══ 16色編碼系統 ══
// 色相每22.5度一個，飽和度85%亮度55%，間距夠大壓縮後仍可辨識
const PALETTE_16=(()=>{
  const colors=[];
  for(let i=0;i<16;i++){
    const h=i*22.5;
    const s=0.85,l=0.55;
    const c=(1-Math.abs(2*l-1))*s;
    const x=c*(1-Math.abs((h/60)%2-1));
    const m=l-c/2;
    let r=0,g=0,b=0;
    if(h<60){r=c;g=x;}
    else if(h<120){r=x;g=c;}
    else if(h<180){g=c;b=x;}
    else if(h<240){g=x;b=c;}
    else if(h<300){r=x;b=c;}
    else{r=c;b=x;}
    colors.push([
      Math.round((r+m)*255),
      Math.round((g+m)*255),
      Math.round((b+m)*255)
    ]);
  }
  return colors;
})();

// id(1~128) → 固定兩色index
// 16×16=256種組合，足夠覆蓋128張牌且每個牌有唯一對應
function idToColorPair(id){
  const n=id-1; // 0~127
  const i1=n%16;
  const i2=Math.floor(n/16);
  return [i1,i2];
}

function colorToHex([r,g,b]){
  return `#${r.toString(16).padStart(2,'0')}${g.toString(16).padStart(2,'0')}${b.toString(16).padStart(2,'0')}`;
}

// ══ 儲存卡片（html2canvas 截 DOM，完全繞開 canvas taint） ══
async function saveCard() {
  const overlay = document.getElementById('card-preview-overlay');
  const previewImg = document.getElementById('card-preview-img');
  previewImg.src = '';
  overlay.classList.add('show');

  try {
    const card = buildShareCard();
    card.style.cssText += 'position:fixed;left:-9999px;top:0;z-index:-1;';
    document.body.appendChild(card);

    // 等圖片全部載入
    await Promise.all(
      Array.from(card.querySelectorAll('img')).map(img =>
        img.complete ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = r; })
      )
    );
    // 再等一幀確保渲染
    await new Promise(r => requestAnimationFrame(r));

    const canvas = await html2canvas(card, {
      width: 1080,
      height: 580,
      scale: 1,
      useCORS: false,
      allowTaint: true,
      backgroundColor: null,
      logging: false
    });

    document.body.removeChild(card);
    previewImg.src = canvas.toDataURL('image/png');
  } catch (e) {
    console.error(e);
    document.body.querySelector('[style*="-9999px"]')?.remove();
    overlay.classList.remove('show');
    alert('卡片生成失敗：' + e.message);
  }
}

// ══ 建構分享卡片 DOM（1080×580，神秘占卜風） ══
function buildShareCard() {
  const labels = ['近況', '挑戰', '貴人'];
  const now = new Date();
  const pad = n => String(n).padStart(2, '0');
  const dateStr = `${now.getFullYear()} · ${pad(now.getMonth()+1)} · ${pad(now.getDate())}  ${pad(now.getHours())}:${pad(now.getMinutes())}`;

  const wrap = document.createElement('div');
  wrap.style.cssText = [
    'width:1080px','height:580px','overflow:hidden','box-sizing:border-box',
    'background:linear-gradient(135deg,#12090a 0%,#1c1005 35%,#221408 50%,#1c1005 65%,#12090a 100%)',
    'position:relative','font-family:serif','border-radius:18px',
    'border:2px solid rgba(180,130,40,0.55)'
  ].join(';');

  // 中央光暈
  const glow = el('div', 'position:absolute;inset:0;border-radius:18px;pointer-events:none;' +
    'background:radial-gradient(ellipse at 50% 45%,rgba(255,210,100,0.11) 0%,transparent 62%)');
  wrap.appendChild(glow);

  // 內框線
  wrap.appendChild(el('div',
    'position:absolute;inset:9px;border-radius:12px;pointer-events:none;' +
    'border:1px solid rgba(255,210,100,0.18)'));

  // 四角裝飾（純 CSS border）
  [
    'top:14px;left:14px;border-top:2px solid rgba(200,160,60,0.6);border-left:2px solid rgba(200,160,60,0.6)',
    'top:14px;right:14px;border-top:2px solid rgba(200,160,60,0.6);border-right:2px solid rgba(200,160,60,0.6)',
    'bottom:14px;left:14px;border-bottom:2px solid rgba(200,160,60,0.6);border-left:2px solid rgba(200,160,60,0.6)',
    'bottom:14px;right:14px;border-bottom:2px solid rgba(200,160,60,0.6);border-right:2px solid rgba(200,160,60,0.6)'
  ].forEach(s => wrap.appendChild(el('div',
    `position:absolute;width:28px;height:28px;pointer-events:none;${s}`)));

  // 標題區（上方橫線用 border-top）
  const header = el('div',
    'text-align:center;padding:28px 60px 16px;' +
    'border-bottom:1px solid rgba(200,160,60,0.25);margin:0 50px;');
  header.innerHTML = `
    <div style="font-size:34px;font-weight:900;color:#f5d97a;letter-spacing:4px;margin-bottom:7px;
      text-shadow:0 0 22px rgba(255,200,80,0.45);">✦ 心情拉霸機 · 命運揭示 ✦</div>
    <div style="font-size:17px;color:rgba(220,180,90,0.52);letter-spacing:3px;">${dateStr}</div>
  `;
  wrap.appendChild(header);

  // 三張牌列
  const row = el('div',
    'display:flex;justify-content:center;gap:28px;padding:20px 52px 0;align-items:flex-start;');

  currentIds.forEach((id, i) => {
    const d = getData(id);
    // 直接取 DOM 已顯示的圖片 src（同一張圖，不重新請求）
    const domImg = document.querySelectorAll('#cards-row .result-card-img')[i];
    const imgSrc = domImg ? domImg.src : cardImg(id);

    const col = el('div', 'display:flex;flex-direction:column;align-items:center;gap:10px;flex:1;max-width:272px;');

    // 角色標籤
    col.appendChild(el('div',
      'font-size:19px;color:rgba(255,210,100,0.68);letter-spacing:3px;font-weight:700;',
      labels[i]));

    // 牌框 + 圖片
    const frame = el('div',
      'width:228px;height:228px;border-radius:12px;overflow:hidden;' +
      'border:1.5px solid rgba(180,130,40,0.52);background:#08050a;' +
      'box-shadow:0 0 20px rgba(180,120,20,0.14),inset 0 0 14px rgba(0,0,0,0.45);' +
      'position:relative;');
    const img = document.createElement('img');
    img.src = imgSrc;
    img.style.cssText = 'width:100%;height:100%;object-fit:contain;display:block;';
    // 牌圖暗角疊加
    const vignette = el('div',
      'position:absolute;inset:0;pointer-events:none;' +
      'background:linear-gradient(to bottom,rgba(0,0,0,0.22) 0%,transparent 28%,transparent 72%,rgba(0,0,0,0.32) 100%)');
    frame.appendChild(img);
    frame.appendChild(vignette);
    col.appendChild(frame);

    // 牌名
    col.appendChild(el('div',
      'font-size:21px;color:#f0e0b0;font-weight:700;letter-spacing:1px;text-align:center;' +
      'text-shadow:0 0 10px rgba(255,180,60,0.28);',
      `${d.emoji} ${d.name}`));

    row.appendChild(col);
  });
  wrap.appendChild(row);

  // 底部：分隔線 + 色塊
  const footer = el('div',
    'position:absolute;bottom:0;left:0;right:0;height:56px;' +
    'display:flex;align-items:center;justify-content:center;gap:0;' +
    'border-top:1px solid rgba(200,160,60,0.2);');

  const colorsWrap = el('div', 'display:flex;gap:5px;align-items:center;');
  currentIds.forEach((id, gi) => {
    const [c1, c2] = idToColorPair(id);
    [c1, c2].forEach((ci, j) => {
      const b = el('div',
        `width:50px;height:18px;border-radius:4px;background:${colorToHex(PALETTE_16[ci])};` +
        `border:1px solid rgba(255,255,255,0.1);` +
        (j === 1 && gi < 2 ? 'margin-right:18px;' : ''));
      colorsWrap.appendChild(b);
    });
  });

  const wm = el('div',
    'position:absolute;right:26px;bottom:14px;' +
    'font-size:13px;color:rgba(200,170,80,0.2);letter-spacing:1px;',
    'mood-gacha');

  footer.appendChild(colorsWrap);
  wrap.appendChild(footer);
  wrap.appendChild(wm);

  return wrap;
}

// ── 輔助：快速建立帶 style 的 div ──
function el(tag, style, text) {
  const e = document.createElement(tag);
  if (style) e.style.cssText = style;
  if (text !== undefined) e.textContent = text;
  return e;
}

function closeCardPreview(){
  document.getElementById('card-preview-overlay').classList.remove('show');
}
